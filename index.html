<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf7f1">
<title>Creavonturas · E-bike tours in Mijas en Fuengirola</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c9082f'/%3E%3Cg fill='none' stroke='%23f3ab24' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='19' cy='40' r='9'/%3E%3Ccircle cx='45' cy='40' r='9'/%3E%3Cpath d='M19 40l8-15h14l4 15M27 25l-3-6M24 19h6M41 25l2-6h5'/%3E%3C/g%3E%3C/svg%3E">

<style>/* Creavonturas — huisstijl uit het logo (rood + goud, Spaanse zon), typografie van Deja Nails
   (Cormorant Garamond + Parisienne + Archivo). Telefoon eerst; alle tekst gecentreerd. */
:root {
  --rood: #c9082f;
  --rood-diep: #a10626;
  --rood-zacht: #fbe7ea;
  --goud: #f3ab24;
  --goud-diep: #d48c0b;
  --goud-zacht: #fdf1d8;
  --kalk: #fbf7f1;
  --zand: #f5ecdf;
  --wit: #ffffff;
  --inkt: #2a1f1c;
  --grijs: #6b5f59;
  --lijn: #eadfd0;
  --wa: #1fa855;
  --font-sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-script: 'Parisienne', 'Snell Roundhand', 'Apple Chancery', cursive;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --rand: clamp(1.125rem, 5vw, 4rem);
  --sectie: clamp(4.25rem, 10vw, 8rem);
  --kop-h: 68px;
  --r: 22px;
  --schaduw: 0 1px 2px rgba(42, 31, 28, 0.05), 0 12px 32px -12px rgba(42, 31, 28, 0.16);
  --schaduw-groot: 0 2px 4px rgba(42, 31, 28, 0.05), 0 30px 60px -24px rgba(42, 31, 28, 0.28);
}
@media (min-width: 1100px) {
  :root { --kop-h: 80px; }
}
*, *::before, *::after { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: calc(var(--kop-h) + 12px);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; transition-delay: 0s !important; }
}
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.65;
  color: var(--inkt);
  background: var(--kalk);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  text-align: center;
  overflow-wrap: break-word;
  hyphens: manual;
}
body.vast-scherm { overflow: hidden; }
@media (max-width: 759px) {
  .voet { padding-bottom: calc(2.25rem + 76px + env(safe-area-inset-bottom)); }
}
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; }
p, ul, ol, figure, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 500;
  line-height: 1.06;
  letter-spacing: -0.01em;
  text-wrap: balance;
  hyphens: manual;
}
:focus-visible { outline: 2.5px solid var(--rood); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--goud); color: var(--inkt); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: var(--rand); }
.smal { max-width: 760px; margin-inline: auto; }

/* ---------- Typografie ---------- */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  margin: 0 0 1rem;
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--rood);
}
.eyebrow::before, .eyebrow::after {
  content: '';
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: var(--goud);
  flex: none;
}
.kop { margin-inline: auto; max-width: 820px; }
.kop h2 { font-size: clamp(2.1rem, 6.4vw, 3.7rem); }
.script {
  display: block;
  font-family: var(--font-script);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.15;
  color: var(--rood);
}
.kop h2 .script { font-size: 1.16em; margin-top: 0.02em; }
/* Glans: een gouden streep zonlicht trekt over het rode scriptwoord. Ruimer vlak, zodat krullen niet worden afgesneden. */
.glans {
  display: inline-block;
  padding: 0.12em 0.42em 0.26em;
  margin: -0.12em -0.42em -0.26em;
  background-image: linear-gradient(100deg, var(--rood) 0%, var(--rood) 38%, #e8661c 46%, var(--goud) 50%, #e8661c 54%, var(--rood) 62%, var(--rood) 100%);
  background-size: 260% 100%;
  background-position: 100% 0;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: glans 7s var(--ease) infinite;
}
@keyframes glans {
  0%, 30% { background-position: 100% 0; }
  70%, 100% { background-position: 0% 0; }
}
.intro {
  margin: 1.25rem auto 0;
  max-width: 60ch;
  font-size: clamp(1.03rem, 1.6vw, 1.18rem);
  line-height: 1.7;
  color: var(--grijs);
}

/* ---------- Knoppen ---------- */
.knop {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  min-height: 52px;
  padding: 0 1.6rem;
  border: 1.5px solid transparent;
  border-radius: 999px;
  font-size: 0.97rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.knop svg { width: 20px; height: 20px; flex: none; }
.knop:active { transform: scale(0.97); }
.knop-rood { background: var(--rood); color: var(--wit); box-shadow: 0 10px 24px -12px rgba(201, 8, 47, 0.7); }
.knop-rood:hover { background: var(--rood-diep); }
.knop-wit { background: var(--wit); color: var(--inkt); border-color: var(--lijn); }
.knop-wit:hover { border-color: var(--inkt); }
.knop-wit .wa-icoon { color: var(--wa); }
.knop-lijn { background: transparent; color: var(--inkt); border-color: rgba(42, 31, 28, 0.22); }
.knop-lijn:hover { border-color: var(--inkt); background: var(--wit); }
.knop-klein { min-height: 44px; padding: 0 1.15rem; font-size: 0.9rem; }
.knop[aria-disabled='true'], .knop:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.knoppen { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 2rem; }
@media (max-width: 520px) {
  .knoppen-stapel { flex-direction: column; align-items: stretch; max-width: 360px; margin-inline: auto; }
  .knoppen-stapel .knop { width: 100%; }
}
.tekstlink { color: var(--rood); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }

/* ---------- Conceptbalk + kop ---------- */
.concept {
  margin: 0;
  padding: 0.55rem var(--rand);
  background: var(--inkt);
  color: #f3e9dc;
  font-size: 0.74rem;
  letter-spacing: 0.02em;
  line-height: 1.45;
}
.kopbalk {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(251, 247, 241, 0.92);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.kopbalk.is-gescrold { border-color: var(--lijn); box-shadow: 0 8px 30px -22px rgba(42, 31, 28, 0.4); }
.kopbalk .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: var(--kop-h); max-width: 1320px; }
.logo { display: block; flex: none; line-height: 0; }
.logo img { height: 38px; width: auto; }
@media (min-width: 1100px) { .logo img { height: 48px; } }
.hoofdnav { display: none; }
.hoofdnav ul { display: flex; gap: clamp(0.9rem, 1.4vw, 1.8rem); }
.hoofdnav a { position: relative; font-size: 0.93rem; font-weight: 500; text-decoration: none; padding: 0.4rem 0; white-space: nowrap; }
.hoofdnav a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; border-radius: 2px; background: var(--goud); transform: scaleX(0); transition: transform 0.35s var(--ease); }
.hoofdnav a:hover::after, .hoofdnav a.is-actief::after { transform: scaleX(1); }
.kop-rechts { display: flex; align-items: center; gap: 0.5rem; }
.kop-rechts .knop-boek { display: none; }
/* Zeven menu-items passen pas vanaf 1280 naast logo en knoppen (Spaans is het langst); daaronder het menu. */
@media (min-width: 1100px) { .kop-rechts .knop-boek { display: inline-flex; } }
@media (min-width: 1280px) {
  .hoofdnav { display: block; }
  .menuknop { display: none !important; }
}
.taal { position: relative; }
.taalknop, .menuknop {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  min-width: 44px;
  height: 44px;
  padding: 0 0.7rem;
  border: 1.5px solid var(--lijn);
  border-radius: 999px;
  background: var(--wit);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.06em;
}
.taalknop svg { width: 16px; height: 16px; }
.taalknop .pijl { width: 12px; height: 12px; transition: transform 0.25s; }
.taalknop[aria-expanded='true'] .pijl { transform: rotate(180deg); }
.menuknop { padding: 0; width: 44px; }
.menuknop svg { width: 22px; height: 22px; }
.taallijst {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  min-width: 190px;
  padding: 0.4rem;
  background: var(--wit);
  border: 1px solid var(--lijn);
  border-radius: 16px;
  box-shadow: var(--schaduw-groot);
  text-align: left;
  z-index: 60;
}
.taallijst button {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 0.85rem;
  border: 0;
  border-radius: 10px;
  background: none;
  font-size: 0.95rem;
}
.taallijst button:hover { background: var(--kalk); }
.taallijst button[aria-current='true'] { color: var(--rood); font-weight: 600; }
.taallijst small { font-size: 0.72rem; letter-spacing: 0.1em; color: var(--grijs); }

/* Menu op telefoon en tablet */
.menu {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  flex-direction: column;
  background: var(--kalk);
  overflow-y: auto;
  animation: menuIn 0.4s var(--ease);
}
.menu[hidden] { display: none; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-12px); } }
.menu-kop { display: flex; align-items: center; justify-content: space-between; height: var(--kop-h); padding-inline: var(--rand); flex: none; }
.menu nav { flex: 1; display: grid; align-content: center; padding: 1.5rem var(--rand) 2rem; }
.menu nav ul { display: grid; gap: 0.15rem; }
.menu nav li a { display: block; padding: 0.55rem 0; font-family: var(--font-serif); font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 500; line-height: 1.15; text-decoration: none; }
.menu .knoppen { margin-top: 1.75rem; }
.menu-zon { width: 46px; height: 4px; margin: 1.6rem auto 0; border-radius: 4px; background: var(--goud); }

/* ---------- Hero ---------- */
.hero { padding-top: clamp(2rem, 4.5vw, 3.25rem); overflow: hidden; background: radial-gradient(ellipse 62% 40% at 50% 26%, rgba(243, 171, 36, 0.14), transparent 72%), var(--kalk); }
.hero > .wrap { padding-bottom: clamp(2.75rem, 7vw, 4.5rem); }
.hero h1 { font-size: clamp(2.55rem, 6.4vw, 5.2rem); max-width: 11.5em; margin-inline: auto; text-wrap: balance; }
.hero h1 .script { font-size: 1.12em; margin-top: 0.04em; }
.hero .intro { max-width: 54ch; }
.vertrouwen { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.55rem 1.4rem; margin-top: 1.75rem; font-size: 0.88rem; font-weight: 500; color: var(--inkt); }
.vertrouwen li { display: inline-flex; align-items: center; gap: 0.45rem; }
.vertrouwen svg { width: 18px; height: 18px; color: var(--goud-diep); flex: none; }
/* Banner: vijf bogen als waaier voor een draaiende zon. Per boog: --rot (kanteling), --y (zakken), --x0 (start richting midden). */
.bogen {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  max-width: 1120px;
  margin: clamp(1.25rem, 3vw, 2.25rem) auto clamp(2.25rem, 5vw, 3.5rem);
  padding-top: 9%;
  isolation: isolate;
}
.bogen.onthul { opacity: 1; transform: none; }
.boog { position: relative; overflow: hidden; border-radius: 999px 999px var(--r) var(--r); aspect-ratio: 3 / 4; background: var(--zand); box-shadow: var(--schaduw); }
.boog img { width: 100%; height: 100%; object-fit: cover; }
.bogen .boog {
  flex: none;
  border: clamp(3px, 0.5vw, 7px) solid var(--wit);
  box-shadow: var(--schaduw-groot);
  transform-origin: 50% 100%;
  transform: translateX(var(--x, 0%)) translateY(var(--y, 0%)) rotate(var(--rot, 0deg));
  transition: transform 1.3s var(--ease), opacity 0.9s var(--ease);
}
.bogen .boog-mid { width: 31%; z-index: 3; }
.bogen .boog-zij { width: 23%; z-index: 2; --y: -1%; }
.bogen .boog-ver { width: 17.5%; z-index: 1; --y: 6%; }
.bogen .boog-zij.links { margin-right: -3.5%; --rot: -6deg; --x0: 45%; }
.bogen .boog-zij.rechts { margin-left: -3.5%; --rot: 6deg; --x0: -45%; }
.bogen .boog-ver.links { margin-right: -3.5%; --rot: -12deg; --x0: 110%; }
.bogen .boog-ver.rechts { margin-left: -3.5%; --rot: 12deg; --x0: -110%; }
@media (prefers-reduced-motion: no-preference) {
  .bogen.onthul:not(.is-zichtbaar) .boog:not(.boog-mid) { --x: var(--x0); --rot: 0deg; opacity: 0; }
  .bogen.onthul:not(.is-zichtbaar) .boog-mid { --y: 5%; opacity: 0; }
  .bogen .boog-zij { transition-delay: 0.12s; }
  .bogen .boog-ver { transition-delay: 0.24s; }
  .bogen.onthul:not(.is-zichtbaar) .stempel { opacity: 0; transform: rotate(-40deg) scale(0.6); }
}
/* Zon: midden op de boog van de middelste foto. Marges in % = % van de breedte. */
.zon { position: absolute; z-index: -1; left: 50%; top: 0; width: 60%; aspect-ratio: 1; margin: -5.5% 0 0 -30%; pointer-events: none; clip-path: inset(-30% -30% 7% -30%); }
.zon::before {
  content: '';
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(243, 171, 36, 0.3) 0deg 4deg, transparent 4deg 12deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 52%, #000 58%, transparent 100%);
  mask: radial-gradient(circle closest-side, transparent 52%, #000 58%, transparent 100%);
  animation: zon-draai 160s linear infinite;
}
.zon::after {
  content: '';
  position: absolute;
  inset: 6.5%;
  border-radius: 50%;
  background: radial-gradient(circle closest-side, var(--goud) 0 76%, rgba(243, 171, 36, 0.3) 76.5% 99%, transparent 100%);
}
@keyframes zon-draai { to { transform: rotate(1turn); } }
/* Stempel: draaiende ring met de prijs in het midden (alleen sier; de prijs staat ook onder de knoppen). */
.stempel {
  position: absolute;
  z-index: 4;
  right: 18.5%;
  top: 12%;
  display: grid;
  place-items: center;
  width: clamp(96px, 11.5vw, 140px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--rood);
  color: var(--wit);
  box-shadow: 0 16px 34px -14px rgba(161, 6, 38, 0.7);
  transform: rotate(-10deg);
  transition: transform 1s var(--ease) 0.5s, opacity 0.6s var(--ease) 0.5s;
}
.stempel::before { content: ''; position: absolute; inset: 21%; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.5); }
.stempel-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: zon-draai 30s linear infinite; }
.stempel-ring text { font-family: var(--font-sans); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; fill: #ffe3a6; }
.stempel-midden { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.stempel-midden small { font-size: clamp(0.52rem, 0.8vw, 0.68rem); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.stempel-midden b { margin: 0.08em 0 0.04em; font-family: var(--font-serif); font-size: clamp(1.45rem, 2.6vw, 2.2rem); font-weight: 600; color: var(--goud); }
@media (max-width: 759px) {
  .bogen { padding-top: 12%; }
  .bogen .boog-ver { display: none; }
  .bogen .boog-mid { width: 50%; }
  .bogen .boog-zij { width: 32%; }
  .bogen .boog-zij.links { margin-right: -7%; }
  .bogen .boog-zij.rechts { margin-left: -7%; }
  .zon { width: 92%; margin: -9% 0 0 -46%; }
  .stempel { right: 0; top: 2%; }
}
@media (prefers-reduced-motion: reduce) { .zon::before, .stempel-ring { animation: none; } }
.golf { display: block; width: 100%; height: clamp(28px, 5vw, 64px); color: var(--rood); margin-top: -1px; }

/* ---------- Lopende strook ---------- */
.marquee { overflow: hidden; background: var(--rood); color: var(--wit); padding: 0.95rem 0; }
.marquee-rij { display: flex; width: max-content; animation: loop 48s linear infinite; }
.marquee-rij span { display: inline-flex; align-items: center; gap: 1.6rem; padding-right: 1.6rem; font-family: var(--font-serif); font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-style: italic; font-weight: 500; white-space: nowrap; }
.marquee-rij svg { width: 16px; height: 16px; color: var(--goud); flex: none; }
@keyframes loop { to { transform: translateX(-50%); } }

/* ---------- Secties ---------- */
.sectie { padding-block: var(--sectie); }
.sectie-zand { background: var(--zand); }
.sectie-goud { background: var(--goud-zacht); }
.raster { display: grid; gap: clamp(1rem, 2.2vw, 1.6rem); margin-top: clamp(2.5rem, 5vw, 3.5rem); }

/* Waarom */
.waarom .raster { grid-template-columns: 1fr; max-width: 1120px; margin-inline: auto; }
@media (min-width: 640px) { .waarom .raster { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1060px) { .waarom .raster { grid-template-columns: repeat(4, 1fr); } }
.troef { padding: clamp(1.6rem, 3vw, 2.1rem) clamp(1.25rem, 2.4vw, 1.6rem); background: var(--wit); border-radius: var(--r); box-shadow: var(--schaduw); }
.troef-icoon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 1.15rem; border-radius: 50%; background: var(--goud-zacht); color: var(--rood); }
.troef-icoon svg { width: 30px; height: 30px; }
.troef h3 { font-size: 1.55rem; }
.troef p { margin-top: 0.6rem; color: var(--grijs); font-size: 0.97rem; }

/* Tours */
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 2rem; }
.filter { min-height: 42px; padding: 0 1.1rem; border: 1.5px solid var(--lijn); border-radius: 999px; background: var(--wit); font-size: 0.9rem; font-weight: 600; transition: all 0.25s var(--ease); }
.filter:hover { border-color: var(--inkt); }
.filter[aria-pressed='true'] { background: var(--inkt); border-color: var(--inkt); color: var(--wit); }
.tours .raster { grid-template-columns: 1fr; max-width: 1180px; margin-inline: auto; }
@media (min-width: 680px) { .tours .raster { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .tours .raster { grid-template-columns: repeat(3, 1fr); } }
.tour {
  display: flex;
  flex-direction: column;
  background: var(--wit);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--schaduw);
  transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease);
}

.tour-body { display: flex; flex-direction: column; align-items: center; flex: 1; padding: 1.4rem clamp(1.1rem, 2.4vw, 1.5rem) 1.5rem; }
.tour-label { display: inline-block; margin-bottom: 0.65rem; padding: 0.32rem 0.75rem; border-radius: 999px; background: var(--goud-zacht); color: #8a5a00; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.04em; }

/* Werkwijze */

}

/* Fotostrook */
/* ---------- Sfeer: grote foto met een zin van Ingrid en Henriette ---------- */
.sfeer { position: relative; }

  .sfeer-foto img { transform: scale(1.1); transition: transform 7s cubic-bezier(0.2, 0.6, 0.2, 1); }

/* De kaart schuift over de foto, maar de tekst begint pas onder de foto (padding > overlap). */
.sfeer-citaat {
  position: relative;
  z-index: 1;
  max-width: 780px;

.fotostrook.fotostrook-home { margin-top: clamp(3rem, 6vw, 4.5rem); }

.fotostrook { position: relative; margin-top: clamp(2.5rem, 5vw, 3.5rem); overflow: hidden; }

.fotostrook:hover .fotostrook-rij { animation-play-state: paused; }
.fotostrook figure { width: clamp(170px, 24vw, 270px); aspect-ratio: 1; border-radius: var(--r); overflow: hidden; flex: none; background: var(--zand); }

}

@media (min-width: 900px) { .over { grid-template-columns: 0.85fr 1.15fr; grid-template-areas: 'foto kop' 'foto tekst'; row-gap: 0; } .over-kop { grid-area: kop; align-self: end; } .over-foto { grid-area: foto; } .over-tekst { grid-area: tekst; align-self: start; } }

.voet-nav a { text-decoration: none; font-size: 0.95rem; opacity: 0.9; }
.voet-nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.voet-talen { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; margin-top: 1.75rem; }
.voet-talen button { min-height: 40px; padding: 0 0.95rem; border: 1px solid rgba(233, 220, 205, 0.25); border-radius: 999px; background: none; color: inherit; font-size: 0.85rem; }
.voet-talen button[aria-current='true'] { background: var(--goud); border-color: var(--goud); color: var(--inkt); font-weight: 600; }
.voet-lijn { width: 100%; height: 1px; margin: 2.25rem 0 1.5rem; background: rgba(233, 220, 205, 0.15); }
.voet small { display: block; font-size: 0.8rem; line-height: 1.6; opacity: 0.78; }
.voet small + small { margin-top: 0.4rem; }
.voet .tekstlink { color: var(--goud); }

/* ---------- Vaste knoppen ---------- */
.balk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.6rem var(--rand) calc(0.6rem + env(safe-area-inset-bottom)); background: rgba(251, 247, 241, 0.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--lijn); }
.balk { transition: transform 0.4s var(--ease), visibility 0s; }
.balk.is-weg { transform: translateY(calc(100% + 4px)); visibility: hidden; transition: transform 0.4s var(--ease), visibility 0s 0.4s; }
.balk .knop { min-height: 50px; padding: 0 0.75rem; font-size: 0.93rem; }
@media (min-width: 760px) { .balk { display: none; } }
.zweef { position: fixed; right: 22px; bottom: 22px; z-index: 40; display: none; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--wa); color: var(--wit); box-shadow: 0 14px 30px -10px rgba(31, 168, 85, 0.7); opacity: 0; transform: translateY(16px) scale(0.9); transition: opacity 0.4s var(--ease), transform 0.4s var(--ease); pointer-events: none; }
.zweef svg { width: 30px; height: 30px; }
.zweef.is-zichtbaar { opacity: 1; transform: none; pointer-events: auto; }
@media (min-width: 760px) { .zweef { display: grid; } }

/* ---------- Pagina's ---------- */
.pagina[hidden] { display: none; }
[tabindex='-1']:focus { outline: none; }
.paginakop { padding: clamp(1.4rem, 4vw, 2.5rem) 0 clamp(2.5rem, 6vw, 4rem); }
.paginakop h1 { font-size: clamp(2.4rem, 7.6vw, 4.4rem); max-width: 16ch; margin-inline: auto; }
.paginakop h1 .script { font-size: 1.12em; margin-top: 0.04em; }
.paginakop .filters { margin-top: 1.6rem; }
.paginakop-kort { padding-bottom: 0; }
.paginakop + .sectie { padding-top: clamp(2.5rem, 6vw, 4rem); }
.paginakop + .sectie:not(.sectie-zand):not(.sectie-goud) { padding-top: 0; }
.paginakop-kort + .sectie .paneel { margin-top: clamp(1.75rem, 4vw, 2.5rem); }
.kruimel { margin: 0 auto clamp(1.4rem, 4vw, 2.1rem); font-size: 0.82rem; line-height: 1.4; color: var(--grijs); }
.kruimel ol { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.3rem 0.55rem; }
.kruimel li { display: inline-flex; align-items: center; gap: 0.55rem; }
.kruimel li + li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--goud); flex: none; }
.kruimel a { display: inline-block; padding: 0.35rem 0.1rem; text-decoration: none; font-weight: 500; }
.kruimel a:hover { color: var(--rood); text-decoration: underline; text-underline-offset: 3px; }
.kruimel [aria-current] { color: var(--inkt); font-weight: 600; }
.sier { display: flex; align-items: center; justify-content: center; gap: 0.7rem; margin-top: 1.75rem; }
.sier::before, .sier::after { content: ''; width: clamp(48px, 12vw, 96px); border-top: 2px dashed rgba(201, 8, 47, 0.4); }
.sier i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--goud); box-shadow: 0 0 0 5px rgba(243, 171, 36, 0.25); }
.over-pagina, .product-wrap { padding-top: clamp(1.4rem, 4vw, 2.5rem); }
.menu nav li a.is-actief { color: var(--rood); }
.voet-nav a.is-actief { color: var(--goud); opacity: 1; }

/* Compacte tourkaart (home en "Andere tours"): de hele kaart is één link */
.raster.tourrij { grid-template-columns: 1fr; max-width: 1180px; margin-inline: auto; }
@media (min-width: 680px) { .raster.tourrij { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .raster.tourrij { grid-template-columns: repeat(3, 1fr); } .raster.tourrij-vier { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 760px) { [data-tourrij] > :nth-child(n + 7) { display: none; } }
.tourkaart, .extrakaart { display: flex; flex-direction: column; background: var(--wit); border-radius: var(--r); overflow: hidden; box-shadow: var(--schaduw); text-decoration: none; transition: translate 0.45s var(--ease), box-shadow 0.45s var(--ease), opacity 0.9s var(--ease), transform 0.9s var(--ease); }
.tourkaart:hover, .extrakaart:hover { translate: 0 -4px; box-shadow: var(--schaduw-groot); }
.tourkaart-foto { display: block; aspect-ratio: 4 / 3; background: var(--zand); overflow: hidden; }
.tourkaart-foto img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.9s var(--ease); }
.tourkaart:hover .tourkaart-foto img { transform: scale(1.04); }
.tourkaart-body { display: flex; flex-direction: column; align-items: center; flex: 1; padding: 1.15rem 1.1rem 1.3rem; }
.tourkaart h3 { margin-top: 0.4rem; font-size: clamp(1.45rem, 4.2vw, 1.65rem); }
.tourkaart .feiten { margin-top: 0.85rem; }
@media (min-width: 1040px) { .tourrij-vier .feiten { gap: 0.3rem; } .tourrij-vier .feiten > * { padding: 0.32rem 0.55rem; font-size: 0.8rem; } }
.kaart-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: auto; padding-top: 1rem; color: var(--rood); font-weight: 600; font-size: 0.92rem; line-height: 1.3; }
.kaart-link svg { width: 16px; height: 16px; flex: none; transition: transform 0.3s var(--ease); }
a:hover .kaart-link svg { transform: translateX(3px); }
.extrakaart { align-items: center; padding: clamp(1.1rem, 2.2vw, 1.4rem); }
.extrakaart h3 { margin-top: 1.1rem; font-size: 1.6rem; }
.extrakaart .extra-prijs { margin-top: 0.45rem; font-family: var(--font-serif); font-size: 1.5rem; font-weight: 600; color: var(--rood); line-height: 1.2; }
.raster.extrarij { grid-template-columns: minmax(0, 1fr); max-width: 560px; margin-inline: auto; }
@media (min-width: 760px) {
  .raster.extrarij { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1120px; }
  .raster.extrarij-twee { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 760px; }
}

/* Collectiepagina: op de telefoon een compacte lijst */
.tours-lijst .raster { margin-top: 0; }
@media (max-width: 759px) {
  .tours-lijst .tour-foto { aspect-ratio: 16 / 10; }
  .tours-lijst .tour-body { padding-top: 1.15rem; padding-bottom: 1.25rem; }
  .tours-lijst .feiten { margin-top: 0.85rem; }
  .tours-lijst .tour-knoppen { padding-top: 1.05rem; }
}

/* Home: kort over ons */
.over-kort { display: grid; gap: clamp(1.5rem, 4vw, 3.5rem); align-items: center; max-width: 1000px; margin-inline: auto; }
@media (min-width: 760px) { .over-kort { grid-template-columns: minmax(220px, 320px) 1fr; } }
.over-kort-foto { width: min(46vw, 210px); margin-inline: auto; }
@media (min-width: 760px) { .over-kort-foto { width: 100%; } }
.over-kort .intro { margin-top: 1rem; }
.over-kort .knoppen { margin-top: 1.5rem; }

/* Home: rode plan-band met een halve zon aan de bovenrand */
.plan-band { --pb: clamp(2.5rem, 7vw, 4.25rem); max-width: 1040px; margin-inline: auto; padding: var(--pb) clamp(1.25rem, 5vw, 3.5rem); border-radius: 32px; background: var(--rood); color: var(--wit); box-shadow: var(--schaduw-groot); }
.band-zon { display: block; width: 96px; height: 48px; margin: calc(-1 * var(--pb)) auto 1.5rem; border-radius: 0 0 96px 96px; background: var(--goud); }
.plan-band .eyebrow { color: #ffe3a6; }
.plan-band h2 { font-size: clamp(2.1rem, 6.4vw, 3.5rem); }
.plan-band h2 .script { font-size: 1.14em; margin-top: 0.02em; color: var(--goud); }
.plan-band .intro { color: rgba(255, 255, 255, 0.9); }
.plan-band .knop-wit { border-color: var(--wit); }

/* ---------- Productpagina ---------- */
.product-wrap { padding-bottom: clamp(2.75rem, 6vw, 4.5rem); }
.product { display: grid; gap: clamp(1.75rem, 4vw, 3.5rem); max-width: 1180px; margin-inline: auto; }
@media (min-width: 900px) { .product { grid-template-columns: 1.1fr 0.9fr; align-items: center; } }
.product-media, .product-info { min-width: 0; }
.galerij { display: flex; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; border-radius: var(--r); aspect-ratio: 4 / 3; background: var(--zand); box-shadow: var(--schaduw); scrollbar-width: none; }
.galerij::-webkit-scrollbar { display: none; }
.galerij > figure { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
.galerij img { width: 100%; height: 100%; object-fit: cover; }
.product-info { display: flex; flex-direction: column; align-items: center; }
.product-info h1 { margin-top: 0.45rem; font-size: clamp(2.3rem, 7vw, 3.5rem); }
.product-kort { margin-top: 0.9rem; max-width: 46ch; color: var(--grijs); font-size: 1.04rem; }
.product-prijs { margin-top: 1rem; font-family: var(--font-serif); font-size: clamp(1.9rem, 5vw, 2.3rem); font-weight: 600; line-height: 1.15; color: var(--rood); font-variant-numeric: lining-nums; }
.product-prijs small { font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.02em; color: var(--grijs); }
.product-info .extra-kleur { margin-top: 0.2rem; font-size: 0.82rem; letter-spacing: 0.06em; color: var(--grijs); }
.product-info .feiten { margin-top: 0.75rem; }
.product-info .knoppen { margin-top: 1.5rem; width: 100%; }
.product-info .vertrouwen { margin-top: 1.4rem; }
.extra-groot { max-width: 560px; margin-inline: auto; border-radius: var(--r); background: var(--wit); box-shadow: var(--schaduw); }
.extra-groot svg { width: 78%; }
.bestel { width: 100%; max-width: 460px; margin-top: 1.4rem; padding: 1.05rem 1.2rem; border-radius: 16px; background: var(--goud-zacht); }
.bestel .blok-kop { margin: 0; }
.bestel p { margin-top: 0.4rem; font-size: 0.95rem; }
.details { display: grid; gap: clamp(1rem, 2.4vw, 1.6rem); max-width: 1120px; margin-inline: auto; }
@media (min-width: 900px) { .details { grid-template-columns: 1fr 1fr; align-items: start; } }
.detail-blok { padding: clamp(1.6rem, 3.4vw, 2.4rem) clamp(1.15rem, 3vw, 2.2rem); background: var(--wit); border-radius: var(--r); box-shadow: var(--schaduw); }
.detail-blok h2 { font-size: clamp(1.9rem, 5vw, 2.4rem); }
.detail-blok .lang { margin: 0.9rem auto 0; max-width: 58ch; color: var(--grijs); }
.blok-kop { margin: 1.6rem 0 0; font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.18em; line-height: 1.4; text-transform: uppercase; color: var(--rood); }
.seizoen-noot { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; max-width: 46ch; margin: 1.1rem auto 0; padding: 0.85rem 1.1rem; border-radius: 16px; background: var(--goud-zacht); font-size: 0.92rem; font-weight: 500; }
.seizoen-noot svg { width: 20px; height: 20px; color: var(--rood); }
.detail-noot { margin: 1.25rem auto 0; max-width: 50ch; font-size: 0.9rem; color: var(--grijs); }
.andere .tourrij, .andere .extrarij { margin-top: clamp(2rem, 4vw, 3rem); }
.b-gekozen { display: flex; width: fit-content; max-width: 100%; align-items: center; gap: 0.5rem; margin: -0.35rem auto 1.1rem; padding: 0.45rem 1rem; border-radius: 999px; background: var(--goud-zacht); font-size: 0.92rem; font-weight: 600; line-height: 1.35; }
.b-gekozen svg { width: 18px; height: 18px; flex: none; color: var(--rood); }

/* ---------- Schuifrijen (telefoon) ---------- */
.stippen { display: flex; justify-content: center; gap: 0.45rem; margin-top: 0.2rem; }
.stippen i { display: block; width: 7px; height: 7px; border-radius: 99px; background: rgba(42, 31, 28, 0.2); transition: width 0.3s var(--ease), background-color 0.3s; }
.stippen i.is-nu { width: 22px; background: var(--rood); }
@media (min-width: 760px) { .stippen { display: none; } }
@media (max-width: 759px) {
  .wrap [data-schuif].schuif {
    --kaart: min(82vw, 400px);
    display: flex;
    gap: 0.8rem;
    width: auto;
    max-width: none;
    margin-inline: calc(-1 * var(--rand));
    padding: 0.5rem calc((100vw - var(--kaart)) / 2) 2rem;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    scroll-padding-inline: calc((100vw - var(--kaart)) / 2);
    scrollbar-width: none;
  }
  .wrap [data-schuif].schuif::-webkit-scrollbar { display: none; }
  .wrap [data-schuif].schuif > * { flex: 0 0 var(--kaart); min-width: 0; scroll-snap-align: center; }
  .wrap [data-schuif].schuif + .stippen { margin-top: -0.85rem; }
  .stappen.schuif .stap { padding: 1.75rem 1.2rem 1.6rem; background: var(--wit); border-radius: var(--r); box-shadow: var(--schaduw); }
  .stappen.schuif .stap-nr { box-shadow: 0 0 0 8px var(--goud-zacht); }
  /* In een veegrij komt de hele rij in beeld; kaarten die nog rechts buiten beeld staan, wachten niet. */
  .schuif > .onthul { opacity: 1; transform: none; transition-delay: 0s !important; }
}
@media (min-width: 760px) { .schuif.onthul { opacity: 1; transform: none; } }

/* ---------- Galerij, lijstjes, praktisch (productpagina) ---------- */
.galerij-duim { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 0.5rem; max-width: calc(var(--n, 4) * 104px); margin: 0.6rem auto 0; }
.galerij-duim button { padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--zand); opacity: 0.7; transition: opacity 0.2s, border-color 0.2s; }
.galerij-duim button[aria-current='true'] { border-color: var(--rood); opacity: 1; }
.galerij-duim img { width: 100%; height: 100%; object-fit: cover; }
.vinklijst { display: grid; gap: 0.4rem; margin-top: 0.7rem; justify-items: center; }
.vinklijst li { display: inline-flex; align-items: flex-start; gap: 0.5rem; font-size: 0.97rem; text-align: left; }
.vinklijst svg { width: 18px; height: 18px; flex: none; margin-top: 0.2rem; color: var(--rood); }
.praktisch { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 1.1rem 0 0; }
.praktisch div { padding: 0.75rem 0.6rem; border-radius: 14px; background: var(--kalk); border: 1px solid var(--lijn); }
.praktisch dt { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grijs); }
.praktisch dd { margin: 0.2rem 0 0; font-weight: 600; font-size: 0.95rem; line-height: 1.35; }

/* ---------- Onthullen ---------- */
.onthul { opacity: 0; transform: translateY(32px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
.onthul.is-zichtbaar { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .onthul { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fotostrook .dubbel { display: none; } }
.b-noot-boven { margin: -0.5rem 0 1rem; }

.eyebrow, .tour-tag, .b-sub, .blok-kop { text-wrap: balance; }
p, li, dd, summary { text-wrap: pretty; }
.stap-nr, .teller output, .extra-prijs, .kal-maand, .feiten, .bedrag, .praktisch dd, .kaart .groot { font-variant-numeric: lining-nums; }

/* Routepagina's: elke route krijgt een eigen sfeer via .route-<id> (kleuren), plus dezelfde opbouw:
   hero, "Over deze tour" met fotokaarten, fotomozaïek, ticket en "Goed om te weten". */

/* ---------- Sfeer per route ----------
   --ra accent · --rd diep accent (koppen, ticketstrook) · --rs zachte achtergrond · --rs2 tweede tint
   --rpap kaartkleur · --rink tekst · --rgrijs zachte tekst · --rlijn lijntjes */
.route {
  --ra: var(--rood); --rd: var(--rood-diep); --rs: var(--zand); --rs2: var(--goud-zacht); --rmoz: var(--kalk);
  --rpap: var(--wit); --rink: var(--inkt); --rgrijs: var(--grijs); --rlijn: var(--lijn);
  --rtint: rgba(30, 20, 20, 0.2);
  --rstub: var(--rd); --rstub-ink: var(--wit); --rprijs: var(--goud);
}
.route-mijas      { --ra: #2f6db5; --rd: #1f4f8a; --rs: #f3f7fc; --rs2: #e4edf8; --rmoz: #fbfdff; --rtint: rgba(20, 60, 120, 0.22); }
.route-tapas      { --ra: #c0562f; --rd: #8c2f2f; --rs: #fcf0e7; --rs2: #f5dfcf; --rmoz: #fff9f4; --rtint: rgba(120, 40, 20, 0.28); }
.route-toro       { --ra: #e8701a; --rd: #2b1a12; --rs: #fdf0e2; --rs2: #f8dcc0; --rmoz: #fff8f0; --rtint: rgba(60, 20, 0, 0.3); --rprijs: #ff9a45; }
.route-fuengirola { --ra: #1f7fc4; --rd: #14558a; --rs: #eef6fb; --rs2: #dcecf7; --rmoz: #f9fcfe; --rtint: rgba(10, 70, 130, 0.22); }
.route-bcosta     { --ra: #14a3a8; --rd: #0b6d72; --rs: #eaf8f7; --rs2: #d3eeec; --rmoz: #f7fdfc; --rtint: rgba(0, 90, 95, 0.22); }
.route-bpueblo    { --ra: #c08a4e; --rd: #8a5a2b; --rs: #f9f1e5; --rs2: #efdfc6; --rmoz: #fffaf2; --rtint: rgba(110, 60, 10, 0.22); }
.route-cala       { --ra: #3f8f4e; --rd: #2a6b45; --rs: #eef6ec; --rs2: #dcecd8; --rmoz: #f9fdf7; --rtint: rgba(10, 70, 30, 0.22); }
.route-entrerios  { --ra: #a07d1c; --rd: #5f5a22; --rs: #f5f1e0; --rs2: #e8e0c2; --rmoz: #fdfbf2; --rtint: rgba(70, 55, 10, 0.25); }
/* Kerst is een nachtpagina */
.route-kerst {
  --ra: var(--goud); --rd: #ffd27a; --rs: #0d1230; --rs2: #151b45; --rmoz: #090d26; --rpap: #1a2152;
  --rink: #f6f0e4; --rgrijs: rgba(246, 240, 228, 0.78); --rlijn: rgba(255, 210, 122, 0.28);
  --rtint: rgba(5, 8, 30, 0.45); --rstub: var(--goud); --rstub-ink: #2a1f1c; --rprijs: #2a1f1c;
  background: var(--rmoz); color: var(--rink);
}

.route { color: var(--rink); }
.route .sectie { background: var(--rs); }
.route h1, .route h2, .route h3 { color: var(--rink); }
.route .eyebrow, .route .blok-kop { color: var(--rd); }
.route .eyebrow::before, .route .eyebrow::after { background: var(--ra); }
.route-over { background: var(--rs); }
.route .route-mozaiek { background: var(--rmoz); }
.route .route-ticketsec { background: var(--rs2); }
.route .andere { background: var(--kalk); }
.route .andere h2 { color: var(--inkt); }
.route .andere .eyebrow { color: var(--rood); }

/* ---------- Hero ---------- */
.route-hero { position: relative; display: flex; align-items: flex-end; min-height: clamp(560px, 84svh, 880px); overflow: hidden; background: #1b1512; color: #fff; isolation: isolate; }
.route-hero-bg { position: absolute; inset: 0; z-index: -2; background: var(--h-m) center / cover no-repeat; transform: scale(1.04); }
@media (max-width: 699px) { .route-hero { min-height: min(92svh, 760px); } .route-hero-bg { background-image: var(--h-p); } }
@media (min-width: 1200px) { .route-hero-bg { background-image: var(--h-l); } }
.route-hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background:
  linear-gradient(180deg, rgba(12, 9, 8, 0.45) 0%, rgba(12, 9, 8, 0.08) 28%, rgba(12, 9, 8, 0.42) 55%, rgba(12, 9, 8, 0.86) 100%),
  linear-gradient(0deg, var(--rtint), var(--rtint)); }
.route-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: clamp(22px, 4vw, 52px); background: var(--rs); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.route-hero-in { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: clamp(1.2rem, 4vw, 2rem); padding-bottom: clamp(3.4rem, 8vw, 5.2rem); width: 100%; }
.route-hero .kruimel { margin-bottom: auto; padding-bottom: clamp(2rem, 8vw, 5rem); color: rgba(255, 255, 255, 0.85); }
.route-hero .kruimel [aria-current] { color: #fff; }
.route-hero .kruimel a:hover { color: var(--goud); }

/* ---------- Over deze tour ---------- */

.route-kaart { position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: 1.15rem; background: var(--rpap); border: 1px solid var(--rlijn); border-radius: var(--r); box-shadow: var(--schaduw); overflow: hidden; }

/* ---------- Fotomozaïek ---------- */
.route .route-mozaiek { padding-block: clamp(3.5rem, 8vw, 6rem); }
.mozaiek { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; margin: clamp(1.75rem, 4vw, 2.75rem) auto 0; max-width: 1180px; }
.mz { position: relative; margin: 0; aspect-ratio: 1; overflow: hidden; border-radius: var(--r); background: var(--rs2); box-shadow: var(--schaduw); }
.mz img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s var(--ease); }

.mz1, .mz6 { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
.mz2 { border-radius: 999px 999px var(--r) var(--r); }
.mz4 { border-radius: var(--r) 999px 999px var(--r); }
@media (min-width: 760px) {
  .mozaiek { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, clamp(150px, 17vw, 250px)); gap: clamp(0.6rem, 1.4vw, 1rem); }
  .mz { aspect-ratio: auto; }
  .mz1 { grid-area: 1 / 1 / 3 / 3; }
  .mz2 { grid-area: 1 / 3 / 2 / 4; border-radius: 999px 999px var(--r) var(--r); }
  .mz3 { grid-area: 1 / 4 / 3 / 5; }
  .mz4 { grid-area: 2 / 3 / 3 / 4; border-radius: var(--r) var(--r) 999px 999px; }
  .mz5 { grid-area: 3 / 1 / 4 / 3; }
  .mz6 { grid-area: 3 / 3 / 4 / 5; }
  .mz1, .mz6 { aspect-ratio: auto; }
}

.rt-band { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.2rem 1.1rem; margin: 0 calc(-1 * clamp(1rem, 3vw, 2rem)) 1.4rem; padding: 0.85rem 1rem; background: var(--rstub); color: var(--rstub-ink); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; line-height: 1.5; }

ieme stadstour","short":"Het bruisende Fuengirola op z'n best: 12 kilometer langs de kust en door de stad.","long":"De kortste en meest ontspannen tour. Je ontdekt Fuengirola vanaf de fiets: de kustlijn, de mooiste plekjes en verhalen die je als toerist niet hoort. Ideaal als eerste kennismaking.","h1":"12 km langs de kustlijn","h2":"De mooiste plekjes van de stad","h3":"Kort en ontspannen","dur":"± 2,5 uur, zonder stop"},"tapas":{"name":"Tapas · Fuengirola & Mijas Costa","tag":"Een culinaire fietsbeleving","short":"Fietsen en proeven: tapas met een drankje bij drie verschillende restaurants.","long":"Een tour voor wie van lekker eten houdt. Je fietst langs drie restaurants in Fuengirola en Mijas Costa en krijgt bij elk restaurant tapas met een drankje. Spaanser wordt het niet.","h1":"Drie restaurants","h2":"Tapas met een drankje, inbegrepen","h3":"Fuengirola en Mijas Costa","dur":"± 3,5 uur"},"kerst":{"name":"Kerstlichtjes Tapastour","tag":"De magie van winterse verlichting","short":"'s Avonds door het verlichte Fuengirola, met tapas en drankjes bij meerdere stops.","long":"Als de kerstverlichting brandt, is Fuengirola op z'n mooist. We vertrekken rond 18:30 en fietsen langs de lichtjes, met tapas en een drankje bij meerdere stops. Deze tour rijdt van eind november tot en met 6 januari en gaat door vanaf 4 deelnemers.","h1":"Fuengirola in kerstverlichting","h2":"Tapas en drankjes bij meerdere stops","h3":"Vertrek rond 18:30","dur":"± 3 uur"}}},"how":{"eyebrow":"Zo werkt het","h2":"Zo zit jij","script":"op de fiets","s1t":"Kies je tour","s1d":"Dorp, kust, campo of tapas: kies de route die bij je past.","s2t":"Prik een dag","s2d":"Kies een datum in onze agenda, of stuur ons gewoon een appje.","s3t":"Wij bevestigen","s3d":"Je krijgt een bevestiging via WhatsApp. Betalen doe je ter plaatse."},"gallery":{"eyebrow":"Onderweg","h2":"Zo ziet een dag","script":"met ons eruit"},"about":{"eyebrow":"Even voorstellen","h2":"Hallo, wij zijn","script":"Ingrid & Henriette","p1":"T E e-bike."},"info":{"eyebrow":"Goed om te weten","h2":"Alles wat je","script":"wilt weten","q1":"Moet ik reserveren?","a1":"Ja, reserveren is verplicht. Zo weet je zeker dat er een fiets en een plek voor je klaarstaan.","q2":"Ik fiets niet zo vaak. Kan ik mee?","a2":"Zeker. We fietsen op elektrische fietsen, dus heuvels zijn geen probleem. En we fietsen op een heerlijk tempo, met stops onderweg.","q3":"Hoe ver fietsen we?","a3":"Ongeveer 12 tot 30 kilometer, afhankelijk van de route. Bij elke tour zie je de afstand en de duur.","q4":"Wat als het regent?","a4":"Dan verzet of annuleer je je tour gratis.","q5":"Kan ik wijzigen of annuleren?","a5":"Ja, tot 24 uur voor de tour kan dat kosteloos.","q6":"Hoe betaal ik?","a6":"Ter plaatse, contant. Of vooraf via een betaalverzoek.","q7":"Waar vertrekken we en kan ik parkeren?","a7":"We vertrekken vanaf Calle Pozos 37 in Las Lagunas, Fuengirola. Je parkeert gratis voor de deur.","q8":"Is er korting voor groepen?","a8":"Ja. Vanaf 7 personen krijg je 10% groepskorting, ook met familie.","q9":"Is eten inbegrepen?","a9":"Bij de tapastours wel. Bij de andere tours boek je een lunch (€22,50 p.p.) of diner (€30 p.p.) bij. Water onderweg krijg je altijd."},"book":{"eyebrow":"Plan je tour","h2":"Prik een datum,","script":"wij doen de rest","intro":"Kies je tour, je dag en met hoeveel je bent. Je aanvraag gaat via WhatsApp naar Henriette en Ingrid. Zij bevestigen je plek.","orWa":"Liever meteen appen?","orWaBtn":"Stuur een WhatsApp","step":"Stap","of":"van","s1":"Tour","s2":"Datum","s3":"Groep","s4":"Versturen","q1":"Welke tour wil je fietsen?","q2":"Welke dag past jou?","q3":"Met hoeveel personen kom je?","q4":"Klaar om te versturen","part":"Dagdeel","morning":"Ochtend","afternoon":"Middag","evening":"Avond","fixed":"Vertrek rond 18:30","persons":"Personen","person":"persoon","personsWord":"personen","meal":"Eten erbij?","mealNone":"Nee, dank je","mealLunch":"Lunch · + €22,50 p.p.","mealDinner":"Diner · + €30 p.p.","name":"Je naam"," ,"Natuur en uitzichten."]}}},"en":{"meta":{"title":"Creavonturas · E-bike tours in Mijas & Fuengirola","description":"E-bike tours along the Costa del Sol: white villages, the coast, the campo and tapas. With Ingrid and Henriette, from €55 per person."},"concept":"Design proposal · a preview of the new Creavonturas website","nav":{"tours":"Tours","how":"How it works","about":"About us","reviews":"Reviews","info":"Good to know","contact":"Contact","book":"Plan your tour","menu":"Menu","close":"Close","lang":"Language","extras":"Extras","home":"Home","crumbs":"Breadcrumb"},"hero":{"eyebrow":"E-bike tours · Mijas · Fuengirola","h1":"Discover the Costa del Sol","script":"by bike","intro":"Ride an e-bike with Ingrid and Henriette past white villages, along the coast and to the tastiest tapas bars. Relaxed, in a small group, with guides who know the hidden corners.","cta1":"Plan your tour","cta2":"WhatsApp us","trust1":"E-bike included","trust2":"Free cancellation up to 24 h","trust3":"From €55 per person","ring":"E-bike tours • Mijas • Fuengirola • Costa del Sol • ","stampTop":"from","stampPrice":"€55","stampBottom":"pp"},"marquee":["Mijas Pueblo","Fuengirola","Benalmádena","La Cala de Mijas","Entrerríos","The Osborne bull","Tapas","Christmas lights"],"why":{"eyebrow":"Why Creavonturas","h2":"Spain the way you'd","script":"never find alone","intro":"Our tours take you to the prettiest spots, and also to places you would probably never discover by yourself. With a good story, a refreshing stop and above all lots of fun.","c1t":"Cycling without the sweat","c1d":"We ride electric bikes. The hill up to Mijas? It almost rides itself.","c2t":"Routes with passion","c2d":"Planned by us: nature, culture and architecture of the Costa del Sol, at a lovely pace.","c3t":"Fairly priced","c3d":"Bike hire and guiding are in the price. From 7 people you get 10% group discount.","c4t":"Rain? Reschedule free","c4d":"If the weather is bad, you reschedule or cancel at no cost. Up to 24 hours ahead you can always change for free."},"tours":{"eyebrow":"Our bike routes","h2":"Choose your","script":"adventure","intro":"Nine routes from 12 to 30 kilometres. From lively Fuengirola to the white mountain village of Mijas, and from the campo to an evening full of tapas.","fAll":"All","fNature":"Nature","fVillage":"Villages","fCoast":"Coast & city","fFood":"Tapas","km":"km","hours":"hours","pp":"pp","view":"View tour","book":"Book this tour","season":"Late November to 6 January","highlights":"Highlights","included":"Included","inc1":"Electric bike","inc2":"Experienced guide","inc3":"Water on the way","incFood":"Tapas and drinks","practical":"Practical","duration":"Duration","distance":"Distance","price":"Price","start":"Start","startPlace":"Calle Pozos 37, Las Lagunas","extras":"Add lunch: + €22.50 pp · Add dinner: + €30 pp","groupNote":"10% group discount from 7 people","items":{"mijas":{"name":"Mijas Pueblo","tag":"Nature, panoramas and the white village","short":"Up to the most famous white village on the Costa del Sol, with views all the way to the sea.","long":"This tour takes you through nature and up the mountain to Mijas Pueblo: white houses, steep little streets full of flowerpots and panoramas down to the coast. On Wednesdays and Saturdays there is flamenco in the village. On the way you can stop at a restaurant.","h1":"The white mountain village of Mijas Pueblo","h2":"Panoramas over the coast","h3":"Flamenco on Wednesdays and Saturdays","h4":"Optional: stop at a restaurant","dur":"± 4 hours, without stops"},"toro":{"name":"El Toro Fuengirola","tag":"An iconic adventure to the Osborne bull","short":"To the famous black bull on the hill, the icon of Spain, with a drink on the way.","long":"You ride from Fuengirola to the viewpoint at the Osborne bull, the black silhouette that has watched over the country for decades. Up top you have a wonderful view over the coast. Halfway there is time for a drink.","h1":"The Osborne bull up close","h2":"Viewpoint over the coast","h3":"A drink on the way","dur":"± 2.5 hours"},"entrerios":{"name":"Entrerríos","tag":"Nature and breathtaking views","short":"The real, rural Spain: quiet paths, hills and wide views.","long":"A tour through the countryside around Entrerríos. You ride quiet paths through the hills, with a new view around every corner. On this route two guides come along.","h1":"Country paths through the hills","h2":"Wide views","h3":"With two guides","dur":"± 3 hours"},"cala":{"name":"El Campo · La Cala de Mijas","tag":"Varied nature close to the coast","short":"From woods and heath to the beach of La Cala: nature and sea in one tour.","long":"You ride through the campo, past woods and heath, to La Cala de Mijas by the sea. There is a stop on the way, and if you like, you can combine the tour with a golf clinic.","h1":"Woods and heath in the campo","h2":"La Cala de Mijas by the sea","h3":"Optional: golf clinic","dur":"± 3 hours"},"bcosta":{"name":"Benalmádena Costa","tag":"Spain's stunning coastline","short":"Along the coast to the fairytale Castillo El Bil-Bil and the marina Puerto Marina.","long":"A tour along the sea. You ride to Benalmádena Costa, past the red Castillo El Bil-Bil and through Puerto Marina, the special marina with its white buildings. On the way we stop for a bite.","h1":"Castillo El Bil-Bil","h2":"Puerto Marina harbour","h3":"A bite on the way","dur":"± 3 hours"},"bpueblo":{"name":"Benalmádena Pueblo","tag":"Architectural splendour","short":"The historic village above the coast and the striking Castillo de Colomares.","long":"This route is all about special buildings. You ride to historic Benalmádena Pueblo and to the Castillo de Colomares, a castle in honour of Columbus. The castle entrance is not included in the price.","h1":"Historic Benalmádena Pueblo","h2":"Castillo de Colomares","h3":"View over the coast","dur":"± 3 hours, without stops"},"fuengirola":{"name":"Fuengirola","tag":"The ultimate city tour","short":"Lively Fuengirola at its best: 12 kilometres along the coast and through the city.","long":"The shortest and most relaxed tour. You discover Fuengirola from the saddle: the coastline, the prettiest spots and stories you won't hear as a tourist. Ideal as a first introduction.","h1":"12 km along the coastline","h2":"The prettiest spots in town","h3":"Short and relaxed","dur":"± 2.5 hours, without stop"},"tapas":{"name":"Tapas · Fuengirola & Mijas Costa","tag":"A culinary bike experience","short":"Ride and taste: tapas with a drink at three different restaurants.","long":"A tour for anyone who loves good food. You ride past three restaurants in Fuengirola and Mijas Costa and get tapas with a drink at each one. It doesn't get more Spanish than this.","h1":"Three restaurants","h2":"Tapas with a drink, included","h3":"Fuengirola and Mijas Costa","dur":"± 3.5 hours"},"kerst":{"name":"Christmas Lights Tapas Tour","tag":"The magic of winter lights","short":"In the evening through lit-up Fuengirola, with tapas and drinks at several stops.","long":"When the Christmas lights are on, Fuengirola is at its prettiest. We leave around 18:30 and ride past the lights, with tapas and a drink at several stops. This tour runs from late November to 6 January and goes ahead from 4 participants.","h1":"Fuengirola in Christmas lights","h2":"Tapas and drinks at several stops","h3":"Departure around 18:30","dur":"± 3 hours"}}},"how":{"eyebrow":"How it works","h2":"Before you know it,","script":"you're on the bike","s1t":"Choose your tour","s1d":"Village, coast, campo or tapas: pick the route that suits you.","s2t":"Pick a day","s2d":"Choose a date in our calendar, or just send us a message.","s3t":"We confirm","s3d":"You get a confirmation on WhatsApp. You pay on the spot."},"gallery":{"eyebrow":"On the road","h2":"This is what a day","script":"with us looks like"},"about":{"eyebrow":"Nice to meet you","h2":"Hello, we're","script":"Ingrid & Henriette","p1":"Two enthusiastic cyclists who love sharing their passion for adventure with you. As experienced bike guides we take you through the Costa del Sol, around Málaga, Fuengirola and Mijas, to the most beautiful nature, hidden corners and special buildings.","p2":"On our own bike rides we got to know the region from a completely different side. We'd love to show you those hidden gems.","p3":"We love adventure, a good story and above all the fun of being on the road together. Good food and a refreshing drink are part of that, of course: that's how you really experience Spanish culture.","sign":"See you on the bike!"},"reviews":{"eyebrow":"What riders say","h2":"What our guests","script":"say","r1":"Had a super fun afternoon on the bike, a lovely route, thrills and excitement! A must for anyone who wants to discover the area around Fuengirola by bike!","r2":"Did a wonderful tour through beautiful Fuengirola. The guide takes you to the prettiest spots.","r3":"Had a fantastic and fun day of cycling with lots of highlights. Thank you Henriette and Ingrid! Enjoyed the whole day and definitely worth repeating.","cta":"Read all reviews on Tripadvisor"},"more":{"eyebrow":"More from Creavonturas","h2":"Give a gift or","script":"ride more often","giftT":"Gift voucher","giftD":"Give a bike adventure as a gift. Make it extra personal with a lunch or something tasty.","giftP":"From €55","cardT":"5-ride card","cardD":"Love riding with us? Five tours for one fixed price. Personal, and valid on any existing tour.","cardP":"€225","bikeT":"Your own e-bike","bikeD":"Hooked? You can buy the ENGWE e-bike from us, with a free tour and membership of the bike club. Assembly and delivery in Mijas: €50.","bikeP":"€1,499","bikeColors":"Black · Yellow · Blue","ask":"Ask us on WhatsApp","msgGift":"Hello Creavonturas! I'd like to order a gift voucher.","msgCard":"Hello Creavonturas! I'm interested in the 5-ride card.","msgBike":"Hello Creavonturas! I'm interested in the ENGWE e-bike."},"info":{"eyebrow":"Good to know","h2":"Everything you","script":"want to know","q1":"Do I need to book?","a1":"Yes, booking is required. That way you know a bike and a spot are waiting for you.","q2":"I don't cycle much. Can I join?","a2":"Of course. We ride electric bikes, so hills are no problem. And we ride at a lovely pace, with stops on the way.","q3":"How far do we ride?","a3":"About 12 to 30 kilometres, depending on the route. For every tour you can see the distance and duration.","q4":"What if it rains?","a4":"Then you reschedule or cancel your tour for free.","q5":"Can I change or cancel?","a5":"Yes, up to 24 hours before the tour it's free of charge.","q6":"How do I pay?","a6":"On the spot, in cash. Or in advance via a payment request.","q7":"Where do we start and can I park?","a7":"We start at Calle Pozos 37 in Las Lagunas, Fuengirola. You can park for free right outside.","q8":"Is there a discount for groups?","a8":"Yes. From 7 people you get a 10% group discount, family included.","q9":"Is food included?","a9":"On the tapas tours, yes. On the other tours you can add a lunch (€22.50 pp) or dinner (€30 pp). Water on the way is always included."},"book":{"eyebrow":"Plan your tour","h2":"Pick a date,","script":"we do the rest","intro":"Choose your tour, your day and how many of you there are. Your request goes via WhatsApp to Henriette and Ingrid. They confirm your spot.","orWa":"Rather message right away?","orWaBtn":"Send a WhatsApp","step":"Step","of":"of","s1":"Tour","s2":"Date","s3":"Group","s4":"Send","q1":"Which tour do you want to ride?","q2":"Which day suits you?","q3":"How many people are coming?","q4":"Ready to send","part":"Time of day","morning":"Morning","afternoon":"Afternoon","evening":"Evening","fixed":"Departure around 18:30","persons":"People","person":"person","personsWord":"people","meal":"Add a meal?","mealNone":"No, thanks","mealLunch":"Lunch · + €22.50 pp","mealDinner":"Dinner · + €30 pp","name":"Your name","namePh":"First and last name","note":"Note","notePh":"For example: we are two couples","optional":"optional", Hello Creavonturas! I have a question about this tour: {tour}."},"waDefault":"Hello Creavonturas! I have a question about your bike tours.","home":{"quote":"We love adventure, a good story and above all the fun of","quoteScript":"being out together","quoteBy":"Ingrid & Henriette"},"route":{"along":"Along the way","ticket":"Your bike ticket","ticketSub":"Everything about this route at a glance","know":"Good to know","parking":"Free parking at the door","alongEyebrow":"Moments","mijas":{"mood":"White, high and full of flowers","know":["On Wednesdays and Saturdays there is flamenco in the village.","A stop at a restaurant is optional.","About 4 hours, excluding stops."]},"tapas":{"mood":"At the table, between two rides","know":["Tapas and a drink at three restaurants are included.","Fuengirola and Mijas Costa."]},"kerst":{"mood":"When the lights come on","know":["Departure around 18:30, in the evening.","From late November to 6 January (Epiphany).","Runs from 4 participants."]},"toro":{"mood":"A black silhouette against the sky","know":["Viewpoint at the Osborne bull.","There is a stop for a drink along the way."]},"fuengirola":{"mood":"Salty air, sea in sight","know":["A city tour of about 12 km along the coastline.","About 2.5 hours, excluding the stop."]},"bcosta":{"mood":"Harbour, sea and a red fairy tale","know":["Past Castillo El Bil-Bil and Puerto Marina.","With a snack stop along the way."]},"bpueblo":{"mood":"A village full of stories","know":["Entry to Palacio de Colomares is not included.","About 3 hours, excluding stops."]},"cala":{"mood":"Fresh air, green and sea","know":["Forest and heathland, ending at La Cala de Mijas.","The stop along the way and the golf clinic are optional."]},"entrerios":{"mood":"Quiet paths, wide hills","know":["Two guides join this route.","Nature and views."]}}},"sv":{"meta":{"title":"Creavonturas · E-cykelturer i Mijas & Fuengirola","description":"E-cykelturer längs Costa del Sol: vita byar, kusten, campo och tapas. Med Ingrid och Henriette, från 55 € per person."},"concept":"Designförslag · en förhandstitt på nya Creavonturas webbplats","nav":{"tours":"Turer","how":"Så funkar det","about":"Om oss","reviews":"Recensioner","info":"Bra att veta","contact":"Kontakt","book":"Planera din tur","menu":"Meny","close":"Stäng","lang":"Språk","extras":"Extra","home":"Start","crumbs":"Brödsmulor"},"hero":{"eyebrow":"E-cykelturer · Mijas · Fuengirola","h1":"Upptäck Costa del Sol","script":"på cykel","intro":"Cykla e-cykel med Ingrid och Henriette förbi vita byar, längs kusten och till de godaste tapasbarerna. I lugn takt, i en liten grupp, med guider som kan de dolda platserna.","cta1":"Planera din tur","cta2":"Skriv på WhatsApp","trust1":"E-cykel ingår","trust2":"Avboka gratis till 24 h före","trust3":"Från 55 € per person","ring":"E-cykelturer • Mijas • Fuengirola • Costa del Sol • ","stampTop":"från","stampPrice":"55 €","stampBottom":"per person"},"marquee":["Mijas Pueblo","Fuengirola","Benalmádena","La Cala de Mijas","Entrerríos","Osbornetjuren","Tapas","Julljus"],"why":{"eyebrow":"Varför Creavonturas","h2":"Spanien som du","script":"aldrig hittar själv","intro":"Våra turer tar dig inte bara till de vackraste platserna, utan också till ställen du förmodligen aldrig skulle hitta på egen hand. Med en bra historia, ett svalkande stopp och framför allt mycket trivsel.","c1t":"Cykla utan att svettas","c1d":"Vi cyklar på elcyklar. Backen upp till Mijas? Den går nästan av sig själv.","c2t":"Rutter med passion","c2d":"Utstakade av oss själva: natur, kultur och arkitektur på Costa del Sol, i härlig takt.","c3t":"Bra pris","c3d":"Cykelhyra och guide ingår i priset. Från 7 personer får du 10 % grupprabatt.","c4t":"Regn? Boka om gratis","c4d":"Blir vädret dåligt kan du boka om eller avboka utan kostnad. Upp till 24 timmar före kan du alltid ändra gratis."},"tours":{"eyebrow":"Våra cykelrutter","h2":"Välj ditt","script":"äventyr","intro":"Nio rutter på 12 till 30 kilometer. Från livliga Fuengirola till den vita bergsbyn Mijas, och från campo till en kväll full av tapas.","fAll":"Alla","fNature":"Natur","fVillage":"Byar","fCoast":"Kust & stad","fFood":"Tapas","km":"km","hours":"timmar","pp":"/pers.","view":"Se turen","book":"Boka den här turen","season":"Slutet av november till 6 januari","highlights":"Höjdpunkter","included":"Ingår","inc1":"Elcykel","inc2":"Erfaren guide","inc3":"Vatten på vägen","incFood":"Tapas och drycker","practical":"Praktiskt","duration":"Tid","distance":"Sträcka","price":"Pris","start":"Start","startPlace":"Calle Pozos 37, Las Lagunas","extras":"Lägg till lunch: + 22,50 € per person · Middag: + 30 € per person","groupNote":"10 % grupprabatt från 7 personer","items":{"mijas":{"name":"Mijas Pueblo","tag":"Natur, panorama och den vita byn","short":"Upp till Costa del Sols mest kända vita by, med utsikt ända bort till havet.","long":"Den här turen tar dig genom naturen och upp på berget till Mijas Pueblo: vita hus, branta gränder fulla av blomkrukor och panorama ner mot kusten. På onsdagar och lördagar är det flamenco i byn. På vägen kan du stanna vid en restaurang.","h1":"Den vita bergsbyn Mijas Pueblo","h2":"Panorama över kusten","h3":"Flamenco på onsdagar och lördagar","h4":"Valfritt: stopp vid en restaurang","dur":"± 4 timmar, utan stopp"},"toro":{"name":"El Toro Fuengirola","tag":"Ikoniskt äventyr till Osbornetjuren","short":"Till den berömda svarta tjuren på kullen, Spaniens symbol, med en dryck på vägen.","long":"Du cyklar från Fuengirola till utsiktsplatsen vid Osbornetjuren, den svarta silhuetten som vakat över landet i decennier. Däruppe har du en fantastisk utsikt över kusten. På halva vägen finns det tid för en dryck.","h1":"Osbornetjuren på nära håll","h2":"Utsiktsplats över kusten","h3":"Dryck på vägen","dur":"± 2,5 timmar"},"entrerios":{"name":"Entrerríos","tag":"Natur och hänförande utsikter","short":"Det äkta, lantliga Spanien: stilla stigar, kullar och vida utsikter.","long":"En tur genom det vackra landskapet kring Entrerríos. Du cyklar längs lugna stigar genom kullarna, med en ny utsikt vid varje sväng. På den här rutten följer två guider med.","h1":"Lantliga stigar genom kullarna","h2":"Vida utsikter","h3":"Med två guider","dur":"± 3 timmar"},"cala":{"name":"El Campo · La Cala de Mijas","tag":"Omväxlande natur nära kusten","short":"Från skog och hed till stranden i La Cala: natur och hav i en och samma tur.","long":"Du cyklar genom campo, förbi skog och hed, till La Cala de Mijas vid havet. På vägen finns ett stopp, och vill du kan du kombinera turen med en golfclinic.","h1":"Skog och hed i campo","h2":"La Cala de Mijas vid havet","h3":"Valfritt: golfclinic","dur":"± 3 timmar"},"bcosta":{"name":"Benalmádena Costa","tag":"Spaniens fantastiska kustlinje","short":"Längs kusten till sagoslottet Castillo El Bil-Bil och småbåtshamnen Puerto Marina.","long":"En tur längs havet. Du cyklar till Benalmádena Costa, förbi det röda Castillo El Bil-Bil och genom Puerto Marina, den speciella småbåtshamnen med vita byggnader. På vägen stannar vi för något att äta.","h1":"Castillo El Bil-Bil","h2":"Småbåtshamnen Puerto Marina","h3":"Något att äta på vägen","dur":"± 3 timmar"},"bpueblo":{"name":"Benalmádena Pueblo","tag":"Arkitektonisk prakt","short":"Den historiska byn ovanför kusten och det iögonfallande Castillo de Colomares.","long":"Den här rutten handlar om speciella byggnader. Du cyklar till historiska Benalmádena Pueblo och till Castillo de Colomares, ett slott till Columbus ära. Inträdet till slottet ingår inte i priset.","h1":"Historiska Benalmádena Pueblo","h2":"Castillo de Colomares","h3":"Utsikt över kusten","dur":"± 3 timmar, utan stopp"},"fuengirola":{"name":"Fuengirola","tag":"Den ultimata stadsturen","short":"Livliga Fuengirola från sin bästa sida: 12 kilometer längs kusten och genom staden.","long":"Den kortaste och mest avslappnade turen. Du upptäcker Fuengirola från cykelsadeln: kustlinjen, de finaste platserna och historier du inte hör som turist. Perfekt som första bekantskap.","h1":"12 km längs kustlinjen","h2":"Stadens finaste platser","h3":"Kort och avslappnad","dur":"± 2,5 timmar, utan stopp"},"tapas":{"name":"Tapas · Fuengirola & Mijas Costa","tag":"En kulinarisk cykelupplevelse","short":"Cykla och smaka: tapas med en dryck på tre olika restauranger.","long":"En tur för dig som älskar god mat. Du cyklar förbi tre restauranger i Fuengirola och Mijas Costa och får tapas med en dryck på varje. Mer spanskt än så blir det inte.","h1":"Tre restauranger","h2":"Tapas med en dryck, ingår","h3":"Fuengirola och Mijas Costa","dur":"± 3,5 timmar"},"kerst":{"name":"Julljus-tapastur","tag":"Magin i vinterbelysningen","short":"På kvällen genom det upplysta Fuengirola, med tapas och drycker vid flera stopp.","long":"När julbelysningen tänds är Fuengirola som vackrast. Vi startar vid 18:30 och cyklar förbi ljusen, med tapas och en dryck vid flera stopp. Den här turen går från slutet av november till 6 januari och genomförs från 4 deltagare.","h1":"Fuengirola i julbelysning","h2":"Tapas och drycker vid flera stopp","h3":"Start vid 18:30","dur":"± 3 timmar"}}},"how":{"eyebrow":"Så funkar det","h2":"Så sitter du","script":"på cykeln","s1t":"Välj din tur","s1d":"By, kust, campo eller tapas: välj rutten som passar dig.","s2t":"Välj en dag","s2d":"Välj ett datum i vår kalender, eller skriv bara till oss.","s3t":"Vi bekräftar","s3d":"Du får en bekräftelse via WhatsApp. Du betalar på plats."},"gallery":{"eyebrow":"På vägen","h2":"Så ser en dag","script":"med oss ut"},"about":{"eyebrow":"Hej på dig","h2":"Hej, vi är","script":"Ingrid & Henriette","p1":"Två entusiastiska cyklister som gärna delar sin passion för äventyr med dig. Som erfarna cykelguider tar vi dig med genom Costa del Sol, runt Málaga, Fuengirola och Mijas, till den vackraste naturen, dolda platser och speciella byggnader.","p2":"På våra egna cykelturer lärde vi känna trakten från en helt annan sida. De dolda pärlorna visar vi gärna för dig.","p3":"Vi älskar äventyr, en bra historia och framför allt trivseln i att vara ute tillsammans. God mat och en uppfriskande dryck hör förstås till: så får du uppleva den spanska kulturen på riktigt.","sign":"Vi ses på cykeln!"},"reviews":{"eyebrow":"Vad cyklisterna säger","h2":"Det här säger","script":"våra gäster","r1":"Cyklade en jättetrevlig eftermiddag, fin rutt, spänning och sensation! Ett tips till alla som vill upptäcka omgivningarna kring Fuengirola på cykel!","r2":"Gjorde en härlig tur genom vackra Fuengirola. Guiden tar dig till de finaste platserna.","r3":"Hade en fantastisk och trevlig cykeldag med många höjdpunkter. Tack Henriette och Ingrid! Njöt av hela dagen och gärna igen.","cta":"Läs alla recensioner på Tripadvisor"},"more":{"eyebrow":"Mer från Creavonturas","h2":"Ge bort en tur","script":"eller cykla mer","giftT":"Presentkort","giftD":"Ge bort ett cykeläventyr. Gör det extra personligt med en lunch eller något gott.","giftP":"Från 55 €","cardT":"5-turskort","cardD":"Cyklar du gärna med oss ofta? Fem turer för ett fast pris. Personligt, och kan användas på en befintlig tur.","cardP":"225 €","bikeT":"Egen e-cykel","bikeD":"Blev du biten? ENGWE e-cykeln köper du hos oss, med en gratis tur och medlemskap i cykelklubben. Montering och leverans i Mijas: 50 €.","bikeP":"1 499 €","bikeColors":"Svart · Gul · Blå","ask":"Fråga via WhatsApp","msgGift":"Hello Creavonturas! I'd like to order a gift voucher.","msgCard":"Hello Creavonturas! I'm interested in the 5-ride card.","msgBike":"Hello Creavonturas! I'm interested in the ENGWE e-bike."},"info":{"eyebrow":"Bra att veta","h2":"Allt du","script":"vill veta","q1":"Måste jag boka?","a1":"Ja, bokning krävs. Då vet du säkert att en cykel och en plats väntar på dig.","q2":"Jag cyklar inte så ofta. Kan jag följa med?","a2":"Absolut. Vi cyklar på elcyklar, så backar är inget problem. Och vi håller en härlig takt, med stopp på vägen.","q3":"Hur långt cyklar vi?","a3":"Ungefär 12 till 30 kilometer, beroende på rutten. Vid varje tur ser du sträckan och tiden.","q4":"Tänk om det regnar?","a4":"Då bokar du om eller avbokar din tur gratis.","q5":"Kan jag ändra eller avboka?","a5":"Ja, upp till 24 timmar före turen är det kostnadsfritt.","q6":"Hur betalar jag?","a6":"På plats, kontant. Eller i förväg via en betalningsbegäran.","q7":"Var startar vi och kan jag parkera?","a7":"Vi startar från Calle Pozos 37 i Las Lagunas, Fuengirola. Du parkerar gratis utanför dörren.","q8":"Finns det rabatt för grupper?","a8":"Ja. Från 7 personer får du 10 % grupprabatt, även med familjen.","q9":"Ingår mat?","a9":"På tapasturerna, ja. På de andra turerna lägger du till lunch (22,50 € per person) eller middag (30 € per person). Vatten på vägen får du alltid."},"book":{"eyebrow":"Planera din tur","h2":"Välj en dag,","script":"vi fixar resten","intro":"Välj din tur, din dag och hur många ni är. Din förfrågan går via WhatsApp till Henriette och Ingrid. De bekräftar din plats.","orWa":"Hellre skriva direkt?","orWaBtn":"Skicka WhatsApp","step":"Steg","of":"av","s1":"Tur","s2":"Datum","s3":"Grupp","s4":"Skicka","q1":"Vilken tur vill du cykla?","q2":"Vilken dag passar dig?","q3":"Hur många personer kommer ni?","q4":"Redo att skicka","part":"Tid på dagen","morning":"Förmiddag","afternoon":"Eftermiddag","evening":"Kväll","fixed":"Start vid 18:30","persons":"Personer","person":"person","personsWord":"personer","meal":"Lägga till mat?","mealNone":"Nej tack","mealLunch":"Lunch · + 22,50 € per person","mealDinner":"Middag · + 30 € per person","name":"Ditt namn","namePh":"För- och efternamn","note":"Kommentar","notePh":"Till exempel: vi är två par","optional":"valfritt","summary":"Din förfrågan","total":"Totalt","discount":"Grupprabatt 10 %","payNote":"Du betalar på plats, eller i förväg via en betalningsbegäran.","send":"Skicka via WhatsApp","sendMail":"Eller skicka med e-post","next":"Vidare","back":"Tillbaka","change":"Ändra","pickDate":"Välj en dag först","needName":"Fyll i ditt namn","seasonNote":"Den här turen går från slutet av november till 6 januari.","min4":"Genomförs f "Ebike-ture · Mijas · Fuengirola","h1":"Oplev Costa del Sol","script":"på cykel","intro":"Cykl på ebike med Ingrid og Henriette forbi hvide landsbyer, langs kysten og til de lækreste tapasbarer. I roligt tempo, i en lille gruppe, med guider der kender de skjulte steder.","cta1":"Planlæg din tur","cta2":"Skriv på WhatsApp","trust1":"Ebike inkluderet","trust2":"Gratis afbestilling 24 t før","trust3":"Fra 55 € pr. person","ring":"Ebike-ture • Mijas • Fuengirola • Costa del Sol • ","stampTop":"fra","stampPrice":"55 €","stampBottom":"pr. person"},"marquee":["Mijas Pueblo","Fuengirola","Benalmádena","La Cala de Mijas","Entrerríos","Osborne-tyren","Tapas","Julelys"],"why":{"eyebrow":"Hvorfor Creavonturas","h2":"Spanien som du","script":"aldrig selv finder","intro":"Vores ture fører dig ikke kun til de smukkeste steder, men også til steder, du sandsynligvis aldrig selv ville opdage. Med en god historie, et forfriskende stop og frem for alt masser af hygge.","c1t":"Cykl uden at svede","c1d":"Vi kører på elcykler. Bakken op til Mijas? Den går næsten af sig selv.","c2t":"Ruter med passion","c2d":"Udstukket af os selv: natur, kultur og arkitektur på Costa del Sol, i dejligt tempo.","c3t":"Fornuftig pris","c3d":"Cykelleje og guide er med i prisen. Fra 7 personer får du 10 % grupperabat.","c4t":"Regn? Flyt gratis","c4d":"Er vejret dårligt, kan du flytte eller afbestille uden omkostninger. Op til 24 timer før kan du altid ændre gratis."},"tours":{"eyebrow":"Vores cykelruter","h2":"Vælg dit","script":"eventyr","intro":"Ni ruter på 12 til 30 kilometer. Fra livlige Fuengirola til den hvide bjerglandsby Mijas, og fra campo til en aften fuld af tapas.","fAll":"Alle","fNature":"Natur","fVillage":"Landsbyer","fCoast":"Kyst & by","fFood":"Tapas","km":"km","hours":"timer","pp":"pr. pers.","view":"Se turen","book":"Book denne tur","season":"Sidst i november til 6. januar","highlights":"Højdepunkter","included":"Inkluderet","inc1":"Elcykel","inc2":"Erfaren guide","inc3":"Vand undervejs","incFood":"Tapas og drikkevarer","practical":"Praktisk","duration":"Varighed","distance":"Distance","price":"Pris","start":"Start","startPlace":"Calle Pozos 37, Las Lagunas","extras":"Tilkøb frokost: + 22,50 € pr. person · Aftensmad: + 30 € pr. person","groupNote":"10 % grupperabat fra 7 personer","items":{"mijas":{"name":"Mijas Pueblo","tag":"Natur, panoramaer og den hvide landsby","short":"Op til Costa del Sols mest berømte hvide landsby, med udsigt helt ud over havet.","long":"Denne tur tager dig gennem naturen op ad bjerget til Mijas Pueblo: hvide huse, stejle gader fulde af blomsterpotter og panoramaer helt ned til kysten. Om onsdagen og lørdagen er der flamenco i landsbyen. Undervejs kan du stoppe ved en restaurant.","h1":"Den hvide bjerglandsby Mijas Pueblo","h2":"Panoramaer over kysten","h3":"Flamenco om onsdagen og lørdagen","h4":"Valgfrit: stop ved en restaurant","dur":"± 4 timer, uden stop"},"toro":{"name":"El Toro Fuengirola","tag":"Ikonisk eventyr til Osborne-tyren","short":"Til den berømte sorte tyr på bakken, Spaniens ikon, med en drikkevare undervejs.","long":"Du cykler fra Fuengirola til udsigtspunktet ved Osborne-tyren, den sorte silhuet, der har vogtet over landet i årtier. Deroppe har du en storslået udsigt over kysten. Halvvejs er der tid til en drikkevare.","h1":"Osborne-tyren på tæt hold","h2":"Udsigtspunkt over kysten","h3":"Drikkevare undervejs","dur":"± 2,5 timer"},"entrerios":{"name":"Entrerríos","tag":"Natur og åndeløse udsigter","short":"Det ægte, landlige Spanien: stille stier, bakker og vide udsigter.","long":"En tur gennem det smukke landskab omkring Entrerríos. Du cykler ad rolige stier gennem bakkerne, med en ny udsigt for hver sving. På denne rute er der to guider med.","h1":"Landlige stier gennem bakkerne","h2":"Vide udsigter","h3":"Med to guider","dur":"± 3 timer"},"cala":{"name":"El Campo · La Cala de Mijas","tag":"Varieret natur tæt på kysten","short":"Fra skov og hede til stranden i La Cala: natur og hav på én tur.","long":"Du cykler gennem campo, forbi skov og hede, til La Cala de Mijas ved havet. Undervejs er der et stop, og vil du, kan du kombinere turen med en golfclinic.","h1":"Skov og hede i campo","h2":"La Cala de Mijas ved havet","h3":"Valgfrit: golfclinic","dur":"± 3 timer"},"bcosta":{"name":"Benalmádena Costa","tag":"Spaniens smukke kystlinje","short":"Langs kysten til eventyrslottet Castillo El Bil-Bil og lystbådehavnen Puerto Marina.","long":"En tur langs havet. Du cykler til Benalmádena Costa, forbi det røde Castillo El Bil-Bil og gennem Puerto Marina, den særlige lystbådehavn med hvide bygninger. Undervejs stopper vi for en bid mad.","h1":"Castillo El Bil-Bil","h2":"Lystbådehavnen Puerto Marina","h3":"En bid mad undervejs","dur":"± 3 timer"},"bpueblo":{"name":"Benalmádena Pueblo","tag":"Arkitektonisk pragt","short":"Den historiske landsby over kysten og det markante Castillo de Colomares.","long":"Denne rute handler om særlige bygninger. Du cykler til det historiske Benalmádena Pueblo og til Castillo de Colomares, et slot til ære for Columbus. Entréen til slottet er ikke med i prisen.","h1":"Historiske Benalmádena Pueblo","h2":"Castillo de Colomares","h3":"Udsigt over kysten","dur":"± 3 timer, uden stop"},"fuengirola":{"name":"Fuengirola","tag":"Den ultimative bytur","short":"Livlige Fuengirola fra sin bedste side: 12 kilometer langs kysten og gennem byen.","long":"Den korteste og mest afslappede tur. Du opdager Fuengirola fra cyklen: kystlinjen, de smukkeste steder og historier, du ikke hører som turist. Ideel som første bekendtskab.","h1":"12 km langs kystlinjen","h2":"Byens smukkeste steder","h3":"Kort og afslappet","dur":"± 2,5 timer, uden stop"},"tapas":{"name":"Tapas · Fuengirola & Mijas Costa","tag":"En kulinarisk cykeloplevelse","short":"Cykl og smag: tapas med en drikkevare på tre forskellige restauranter.","long":"En tur for dig, der elsker god mad. Du cykler forbi tre restauranter i Fuengirola og Mijas Costa og får tapas med en drikkevare på hver. Mere spansk bliver det ikke.","h1":"Tre restauranter","h2":"Tapas med en drikkevare, inkluderet","h3":"Fuengirola og Mijas Costa","dur":"± 3,5 timer"},"kerst":{"name":"Julelys-tapastur","tag":"Magien i vinterlyset","short":"Om aftenen gennem oplyste Fuengirola, med tapas og drikkevarer på flere stop.","long":"Når julelysene brænder, er Fuengirola på sit smukkeste. Vi starter omkring 18:30 og cykler forbi lysene, med tapas og en drikkevare på flere stop. Denne tur kører fra sidst i november til og med 6. januar og gennemføres fra 4 deltagere.","h1":"Fuengirola i julebelysning","h2":"Tapas og drikkevarer på flere stop","h3":"Start omkring 18:30","dur":"± 3 timer"}}},"how":{"eyebrow":"Sådan gør du","h2":"Før du ved af det,","script":"sidder du på cyklen","s1t":"Vælg din tur","s1d":"Landsby, kyst, campo eller tapas: vælg ruten, der passer til dig.","s2t":"Vælg en dag","s2d":"Vælg en dato i vores kalender, eller send os bare en besked.","s3t":"Vi bekræfter","s3d":"Du får en bekræftelse på WhatsApp. Du betaler på stedet."},"gallery":{"eyebrow":"Undervejs","h2":"Sådan ser en dag","script":"med os ud"},"about":{"eyebrow":"Lad os præsentere os","h2":"Hej, vi er","script":"Ingrid & Henriette","p1":"To begejstrede cyklister, der gerne deler deres passion for eventyr med dig. Som erfarne cykelguider tager vi dig med gennem Costa del Sol, rundt om Málaga, Fuengirola og Mijas, til den smukkeste natur, skjulte steder og særlige bygninger.","p2":"På vores egne cykelture lærte vi egnen at kende fra en helt anden side. De skjulte perler viser vi dig gerne.","p3":"Vi elsker eventyr, en god historie og frem for alt hyggen ved at være afsted sammen. God mad og en forfriskende drikkevare hører naturligvis med: sådan oplever du den spanske kultur for alvor.","sign":"Vi ses på cyklen!"},"reviews":{"eyebrow":"Hvad cyklisterne siger","h2":"Det siger","script":"vores gæster","r1":"Cyklede en super hyggelig eftermiddag, flot rute, spænding og sensation! Anbefales til alle, der vil opdage området omkring Fuengiro
