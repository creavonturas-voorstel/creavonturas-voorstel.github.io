Lagunas","extras":"Añadir comida: + 22,50 € p. p. · Añadir cena: + 30 € p. p.","groupNote":"10 % de descuento de grupo desde 7 personas","items":{"mijas":{"name":"Mijas Pueblo","tag":"Naturaleza, panorámicas y el pueblo blanco","short":"Hasta el pueblo blanco más famoso de la Costa del Sol, con vistas hasta el mar.","long":"Esta ruta te lleva por la naturaleza montaña arriba hasta Mijas Pueblo: casitas blancas, calles empinadas llenas de macetas y panorámicas hasta la costa. Los miércoles y sábados hay flamenco en el pueblo. Por el camino puedes parar en un restaurante.","h1":"El pueblo blanco de Mijas Pueblo","h2":"Panorámicas sobre la costa","h3":"Flamenco los miércoles y sábados","h4":"Opcional: parada en un restaurante","dur":"± 4 horas, sin paradas"},"toro":{"name":"El Toro Fuengirola","tag":"Una aventura de icono: el Toro de Osborne","short":"Hasta el famoso toro negro de la colina, icono de España, con una bebida por el camino.","long":"Pedaleas desde Fuengirola hasta el mirador del Toro de Osborne, la silueta negra que lleva décadas vigilando el país. Desde arriba tienes una vista preciosa de la costa. A mitad de camino hay tiempo para tomar algo.","h1":"El Toro de Osborne de cerca","h2":"Mirador sobre la costa","h3":"Bebida por el camino","dur":"± 2,5 horas"},"entrerios":{"name":"Entrerríos","tag":"Naturaleza y vistas que quitan el aliento","short":"La España auténtica y rural: caminos tranquilos, colinas y vistas amplias.","long":"Una ruta por el campo que rodea Entrerríos. Pedaleas por caminos tranquilos entre colinas, con una vista nueva a cada curva. En esta ruta van dos guías.","h1":"Caminos rurales entre colinas","h2":"Vistas amplias","h3":"Con dos guías","dur":"± 3 horas"},"cala":{"name":"El Campo · La Cala de Mijas","tag":"Naturaleza variada junto a la costa","short":"Del bosque y el brezal a la playa de La Cala: naturaleza y mar en una sola ruta.","long":"Pedaleas por el campo, entre bosque y brezal, hasta La Cala de Mijas, junto al mar. Hay una parada por el camino y, si quieres, puedes combinar la ruta con una clase de golf.","h1":"Bosque y brezal en el campo","h2":"La Cala de Mijas junto al mar","h3":"Opcional: clase de golf","dur":"± 3 horas"},"bcosta":{"name":"Benalmádena Costa","tag":"La preciosa costa de España","short":"Por la costa hasta el castillo de cuento Castillo El Bil-Bil y el puerto deportivo Puerto Marina.","long":"Una ruta junto al mar. Pedaleas hasta Benalmádena Costa, pasando por el rojo Castillo El Bil-Bil y por Puerto Marina, el singular puerto deportivo de edificios blancos. Por el camino paramos a picar algo.","h1":"Castillo El Bil-Bil","h2":"Puerto deportivo Puerto Marina","h3":"Algo de picar por el camino","dur":"± 3 horas"},"bpueblo":{"name":"Benalmádena Pueblo","tag":"Esplendor arquitectónico","short":"El pueblo histórico sobre la costa y el llamativo Castillo de Colomares.","long":"Esta ruta gira en torno a edificios singulares. Pedaleas hasta el histórico Benalmádena Pueblo y hasta el Castillo de Colomares, un castillo en honor a Colón. La entrada al castillo no está incluida en el precio.","h1":"El histórico Benalmádena Pueblo","h2":"Castillo de Colomares","h3":"Vistas sobre la costa","dur":"± 3 horas, sin paradas"},"fuengirola":{"name":"Fuengirola","tag":"El tour urbano definitivo","short":"El animado Fuengirola en su mejor versión: 12 kilómetros por la costa y por la ciudad.","long":"La ruta más corta y más relajada. Descubres Fuengirola desde la bici: la línea de costa, los rincones más bonitos y historias que no oyes como turista. Ideal para un primer contacto.","h1":"12 km por la línea de costa","h2":"Los rincones más bonitos de la ciudad","h3":"Corta y relajada","dur":"± 2,5 horas, sin paradas"},"tapas":{"name":"Tapas · Fuengirola y Mijas Costa","tag":"Una experiencia gastronómica en bici","short":"Pedalear y probar: tapas con una bebida en tres restaurantes distintos.","long":"Una ruta para quien disfruta comiendo bien. Pedaleas entre tres restaurantes de Fuengirola y Mijas Costa y en cada uno te esperan tapas con una bebida. Más español, imposible.","h1":"Tres restaurantes","h2":"Tapas con bebida, incluidas","h3":"Fuengirola y Mijas Costa","dur":"± 3,5 horas"},"kerst":{"name":"Ruta de tapas con luces de Navidad","tag":"La magia de las luces de invierno","short":"De noche por un Fuengirola iluminado, con tapas y bebidas en varias paradas.","long":"Cuando las luces de Navidad están encendidas, Fuengirola está más bonito que nunca. Salimos hacia las 18:30 y pedaleamos entre las luces, con tapas y una bebida en varias paradas. Esta ruta se hace desde finales de noviembre hasta el 6 de enero y sale a partir de 4 participantes.","h1":"Fuengirola con luces de Navidad","h2":"Tapas y bebidas en varias paradas","h3":"Salida hacia las 18:30","dur":"± 3 horas"}}},"how":{"eyebrow":"Cómo funciona","h2":"Y en un momento","script":"sobre la bici","s1t":"Elige tu ruta","s1d":"Pueblo, costa, campo o tapas: elige la ruta que más te guste.","s2t":"Elige un día","s2d":"Escoge una fecha en nuestro calendario, o simplemente escríbenos.","s3t":"Nosotras confirmamos","s3d":"Recibes la confirmación por WhatsApp. Pagas en el lugar."},"gallery":{"eyebrow":"Por el camino","h2":"Así es un día","script":"con nosotras"},"about":{"eyebrow":"Un momento, que nos presentamos","h2":"Hola, somos","script":"Ingrid y Henriette","p1":"Dos ciclistas entusiastas a las que les encanta compartir contigo su pasión por la aventura. Como guías de bici con experiencia, te llevamos por la Costa del Sol, alrededor de Málaga, Fuengirola y Mijas, a la naturaleza más bonita, a rincones escondidos y a edificios especiales.","p2":"En nuestras propias rutas en bici conocimos la zona desde un lado completamente distinto. Esas joyas escondidas queremos enseñártelas.","p3":"Nos encantan la aventura, una buena historia y, sobre todo, el buen ambiente de ir juntos. Comer bien y tomar algo fresquito forman parte de ello, por supuesto: así se vive de verdad la cultura española.","sign":"¡Nos vemos en la bici!"},"reviews":{"eyebrow":"Lo que dicen los ciclistas","h2":"Lo que dicen","script":"nuestros clientes","r1":"Una tarde en bici súper divertida, una ruta preciosa, ¡emoción y adrenalina! ¡Muy recomendable para quien quiera descubrir los alrededores de Fuengirola en bici!","r2":"Una ruta estupenda por la preciosa Fuengirola. La guía te lleva a los rincones más bonitos.","r3":"Un día de bici fantástico y muy agradable, con muchos momentos destacados. ¡Gracias, Henriette e Ingrid! Disfrutamos todo el día y, sin duda, para repetir.","cta":"Lee todas las opiniones en Tripadvisor"},"more":{"eyebrow":"Más de Creavonturas","h2":"Regala o","script":"repite más","giftT":"Bono regalo","giftD":"Regala una aventura en bici. Hazlo más personal con una comida o algo rico.","giftP":"Desde 55 €","cardT":"Bono de 5 rutas","cardD":"¿Te gusta pedalear con nosotras a menudo? Cinco rutas por un precio fijo. Personal, y válido para una ruta ya existente.","cardP":"225 €","bikeT":"Tu propia e-bike","bikeD":"¿Te has enganchado? La e-bike ENGWE la compras con nosotras, con una ruta gratis y la membresía del club ciclista. Montaje y entrega en Mijas: 50 €.","bikeP":"1.499 €","bikeColors":"Negro · Amarillo · Azul","ask":"Pregúntanos por WhatsApp","msgGift":"¡Hola Creavonturas! Me gustaría pedir un bono regalo.","msgCard":"¡Hola Creavonturas! Me interesa el bono de 5 rutas.","msgBike":"¡Hola Creavonturas! Me interesa la e-bike ENGWE."},"info":{"eyebrow":"Bueno saber","h2":"Todo lo que","script":"quieres saber","q1":"¿Tengo que reservar?","a1":"Sí, la reserva es obligatoria. Así te aseguras de que hay una bici y una plaza esperándote.","q2":"No monto mucho en bici. ¿Puedo ir?","a2":"Por supuesto. Vamos en bicis eléctricas, así que las cuestas no son problema. Y pedaleamos a un ritmo agradable, con paradas por el camino.","q3":"¿Cuánto pedaleamos?","a3":"Unos 12 a 30 kilómetros, según la ruta. En cada ruta ves la distancia y la duración.","q4":"¿Y si llueve?","a4":"Entonces cambias   const srcset = m.w.map((x) => `img/${name}-${x}.webp ${x}w`).join(', ');
  return `<img src="img/${name}-${m.w[0]}.webp" srcset="${srcset}" sizes="${sizes}" width="${w}" height="${h}" alt="${esc(alt)}"${eager ? ' fetchpriority="high"' : ' loading="lazy"'} decoding="async">`;
}
const tourFotos = (id) => Object.keys(IMG).filter((k) => k.startsWith(`t-${id}-`)).sort();

const waLink = (text) => `https://wa.me/${WA}?text=${encodeURIComponent(text)}`;
const tourVraag = (id) => t('ui.waTour', msgLang()).replace('{tour}', t(`tours.items.${id}.name`, msgLang()));

// ---------- Datums ----------
const pad2 = (n) => String(n).padStart(2, '0');
const isoVan = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const datumVan = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const vandaag = new Date(); vandaag.setHours(0, 0, 0, 0);
const MIN = new Date(vandaag); MIN.setDate(MIN.getDate() + 1);
const MAX = new Date(vandaag); MAX.setDate(MAX.getDate() + 180);
const inSeizoen = (d) => { const m = d.getMonth(), n = d.getDate(); return (m === 10 && n >= 20) || m === 11 || (m === 0 && n <= 6); };
function magDatum(d, tour) {
  if (d < MIN || d > MAX) return false;
  if (tour && tour.season && !inSeizoen(d)) return false;
  return true;
}
function eersteDatum(tour) {
  const d = new Date(MIN);
  while (d <= MAX) { if (magDatum(d, tour)) return d; d.setDate(d.getDate() + 1); }
  return new Date(MIN);
}
const langeDatum = (iso, l = lang) => new Intl.DateTimeFormat(locale(l), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(datumVan(iso));

// ---------- Pagina's (alles in één document, één pagina tegelijk) ----------
// Alleen een kale #naam gaat mee tussen de link en de pagina. Geen #/pad, geen ?vraag, geen pushState.
function leesRoute() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('tour-') && tourById(h.slice(5))) return { pagina: 'tour', id: h.slice(5), hash: h };
  if (extraById(h)) return { pagina: 'extra', id: h, hash: h };
  if (PAGINAS[h]) return { pagina: h, hash: h };
  return { pagina: 'home', hash: '' };
}
let R = leesRoute();
const paginaEl = (p = R.pagina) => $(`.pagina[data-pagina="${p}"]`);
const productEl = paginaEl('tour');
const extraEl = paginaEl('extra');

function zetTitel() {
  let naam = '';
  if (R.pagina === 'tour') naam = t(`tours.items.${R.id}.name`);
  else if (R.pagina === 'extra') naam = t(`more.${extraById(R.id).k}T`);
  else if (PAGINAS[R.pagina]) naam = t(PAGINAS[R.pagina]);
  document.title = naam ? `${naam} · Creavonturas` : t('meta.title');
}

function markeerNav() {
  const ouder = R.pagina === 'tour' ? 'tours' : R.pagina === 'extra' ? 'extras' : R.hash;
  $$('.hoofdnav a, #menu nav li a, .voet-nav a').forEach((a) => {
    const aan = (a.getAttribute('href') || '').slice(1) === ouder && (ouder !== '' || R.pagina === 'home');
    a.classList.toggle('is-actief', aan);
    if (aan) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

function toon({ eerste = false } = {}) {
  R = leesRoute();
  $$('.pagina').forEach((el) => { el.hidden = el.dataset.pagina !== R.pagina; });
  if (R.pagina === 'tour') tekenProduct(R.id);
  if (R.pagina === 'extra') tekenExtra(R.id);
  if (!menu.hidden) zetMenu(false);
  zetTaalLijst(false);
  zetTitel();
  markeerNav();
  zetBalk();
  // Elke pagina begint bovenaan, meteen (niet glijdend).
  scrollTo(0, 0);
  const el = paginaEl();
  onthulIn(el);
  schuivenIn(el);
  // Focus naar de kop van de nieuwe pagina, maar niet bij het openen van de link: dan blijft de focus waar hij was.
  if (!eerste) { const h1 = $('h1', el); if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); } }
  opScroll();
}
function naar(naam) { if (location.hash.slice(1) === naam) toon(); else location.hash = naam; }
addEventListener('hashchange', () => toon());

function kruimel(pad, hier) {
  return `<nav class="kruimel" aria-label="${esc(t('nav.crumbs'))}"><ol>${pad.map(([h, k]) => `<li><a href="#${h}">${esc(t(k))}</a></li>`).join('')}<li aria-current="page"><span>${esc(hier)}</span></li></ol></nav>`;
}

// ---------- Vertalen ----------
function vertaal() {
  document.documentElement.lang = lang;
  $('meta[name="description"]').setAttribute('content', t('meta.description'));
  $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $$('[data-i18n-ph]').forEach((el) => { el.setAttribute('placeholder', t(el.dataset.i18nPh)); });
  $$('[data-wa]').forEach((el) => { el.href = waLink(t(el.dataset.wa)); });
  $('.taal-code').textContent = lang.toUpperCase();
  const lijst = LANGS.map(([k, naam]) => `<button type="button" data-lang="${k}" lang="${k}" aria-current="${k === lang}"><span>${naam}</span><small>${k.toUpperCase()}</small></button>`).join('');
  $('.taallijst').innerHTML = lijst;
  $('.voet-talen').innerHTML = LANGS.map(([k, naam]) => `<button type="button" data-lang="${k}" lang="${k}" aria-current="${k === lang}">${naam}</button>`).join('');
  tekenMarquee();
  tekenFilters();
  tekenTours();
  tekenTeaser();
  tekenExtras();
  if (R.pagina === 'tour' && productEl.dataset.tour) tekenProduct(R.id, true);
  if (R.pagina === 'extra' && extraEl.dataset.extra) tekenExtra(R.id, true);
  tekenPaneel(false);
  zetTitel();
  zetBalk();
  schuivenIn(document);
}

function zetTaal(l) {
  if (!I18N[l] || l === lang) return;
  lang = l;
  opslag.set('crea-lang', l);
  vertaal();
}

      <div class="knoppen onthul"><a class="knop knop-lijn" href="#tours">${icon('i-fiets')}<span>${esc(t('ui.allTours'))}</span></a></div>

// ---------- Schuifrijen (telefoon) ----------
// Onder 760px worden de kaartrijen een veegrij met een stukje van de volgende kaart in beeld.
// Daarboven blijven het rasters. De productgalerij veegt altijd; de duimfoto's zijn daar de wijzer.
function schuivenIn(root = document) { $$('[data-schuif]', root).forEach(maakSchuif); }

function maakSchuif(rij) {
  const galerij = rij.hasAttribute('data-galerij');
  if (!galerij) {
    let s = rij.nextElementSibling;
    if (!s || !s.classList.contains('stippen')) {
      s = document.createElement('div');
      s.className = 'stippen';
      s.setAttribute('aria-hidden', 'true');
      rij.after(s);
    }
    if (s.childElementCount !== rij.childElementCount) s.innerHTML = '<i></i>'.repeat(rij.childElementCount);
  }
  rij.setAttribute('role', 'region');
  zetTab(rij);
  syncSchuif(rij);
}

function zetTab(rij) {
  if (rij.hasAttribute('data-galerij') || smal.matches) rij.tabIndex = 0;
  else rij.removeAttribute('tabindex');
}

function huidigeIndex(rij) {
  const r = rij.getBoundingClientRect();
  const mid = r.left + r.width / 2;
  let best = 0, afstand = Infinity;
  [...rij.children].forEach((k, i) => {
    const b = k.getBoundingClientRect();
    const d = Math.abs(b.left + b.width / 2 - mid);
    if (d < afstand) { afstand = d; best = i; }
  });
  return best;
}

function syncSchuif(rij) {
  const i = huidigeIndex(rij);
  rij.dataset.nu = String(i);
  if (rij.hasAttribute('data-galerij')) {
    $$('[data-duim]', rij.parentElement).forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
    return;
  }
  const s = rij.nextElementSibling;
  if (s && s.classList.contains('stippen')) [...s.children].forEach((d, j) => d.classList.toggle('is-nu', j === i));
}

const teSyncen = new Set();
let schuifTikt = false;
document.addEventListener('scroll', (e) => {
  const rij = e.target;
  if (!(rij instanceof Element) || !rij.hasAttribute('data-schuif')) return;
  teSyncen.add(rij);
  if (schuifTikt) return;
  schuifTikt = true;
  requestAnimationFrame(() => { schuifTikt = false; teSyncen.forEach(syncSchuif); teSyncen.clear(); });
}, { capture: true, passive: true });
smal.addEventListener('change', () => $$('[data-schuif]').forEach((r) => { zetTab(r); syncSchuif(r); }));

// ---------- Plannen ----------
const paneel = $('#paneel');
const nieuwB = () => ({ step: 1, tour: null, date: null, part: null, n: 2, meal: 'none', name: '', note: '', view: null, done: false });
let B = nieuwB();
let laatsteStap = 0;

function kiesTour(id) {
  const x = tourById(id);
  B.tour = id;
  B.meal = 'none';
  B.part = x.fixed ? 'fixed' : x.parts[0];
  if (B.date && !magDatum(datumVan(B.date), x)) B.date = null;
  const start = B.date ? datumVan(B.date) : eersteDatum(x);
  B.view = [start.getFullYear(), start.getMonth()];
}

function bedragen() {
  const x = tourById(B.tour);
  const basis = x.price * B.n;
  const korting = B.n >= GROEP_VANAF ? Math.round(basis * 0.1 * 100) / 100 : 0;
  const eten = x.meal ? MEALS[B.meal] * B.n : 0;
  return { basis, korting, eten, totaal: basis - korting + eten };
}

function partNaam(l = lang) {
  if (B.part === 'fixed') return t('book.fixed', l);
  return B.part ? t(`book.${B.part}`, l) : '';
}
const mealNaam = (l = lang) => t(B.meal === 'lunch' ? 'book.mealLunch' : B.meal === 'dinner' ? 'book.mealDinner' : 'book.mealNone', l).split('·')[0].trim();
const personen = (n, l = lang) => `${n} ${n === 1 ? t('book.person', l) : t('book.personsWord', l)}`;

function bericht() {
  const l = msgLang();
  const x = tourById(B.tour);
  const b = bedragen();
  const r = [t('book.msgHello', l), ''];
  r.push(`${t('book.msgTour', l)}: ${t(`tours.items.${B.tour}.name`, l)}`);
  if (B.date) r.push(`${t('book.msgDate', l)}: ${langeDatum(B.date, l)}`);
  if (B.part) r.push(`${t('book.msgPart', l)}: ${partNaam(l)}`);
  r.push(`${t('book.msgPersons', l)}: ${B.n}`);
  if (x.meal && B.meal !== 'none') r.push(`${t('book.msgMeal', l)}: ${mealNaam(l)}`);
  r.push(`${t('book.msgTotal', l)}: ${euro(b.totaal, l)}${b.korting ? ` (${t('book.discount', l)})` : ''}`);
  if (B.name.trim()) r.push(`${t('book.msgName', l)}: ${B.name.trim()}`);
  if (B.note.trim()) r.push(`${t('book.msgNote', l)}: ${B.note.trim()}`);
  r.push('', t('book.msgBye', l));
  return r.join('\n');
}

function voortgang() {
  return `<ol class="voortgang" aria-label="${esc(`${t('book.step')} ${B.step} ${t('book.of')} 4`)}">${[1, 2, 3, 4].map((i) => `<li class="${i < B.step ? 'is-klaar' : i === B.step ? 'is-nu' : ''}"${i === B.step ? ' aria-current="step"' : ''}><i></i><span>${esc(t(`book.s${i}`))}</span></li>`).join('')}</ol>`;
}

function navKnoppen({ terug = true, verder = true, verderUit = false } = {}) {
  return `<div class="b-nav">
    ${terug ? `<button class="knop knop-lijn knop-klein" type="button" data-b="terug">${icon('i-links')}<span>${esc(t('book.back'))}</span></button>` : ''}
    ${verder ? `<button class="knop knop-rood knop-klein" type="button" data-b="verder"${verderUit ? ' aria-disabled="true"' : ''}><span>${esc(t('book.next'))}</span>${icon('i-rechts')}</button>` : ''}
  </div>`;
}

function stap1() {
  return `<h2 class="b-vraag" id="b-v1">${esc(t('book.q1'))}</h2>
  <div class="b-tourlijst" role="radiogroup" aria-labelledby="b-v1">
    ${TOURS.map((x) => {
      const naam = t(`tours.items.${x.id}.name`);
      return `<label class="b-tour${B.tour === x.id ? ' is-gekozen' : ''}">
        <input type="radio" name="b-tour" value="${x.id}"${B.tour === x.id ? ' checked' : ''}>
        <span class="b-tour-foto">${pic(`t-${x.id}-0`, '54px')}</span>
        <span><strong>${esc(naam)}</strong><small>${esc(prijsPP(x.price))} · ${x.km} ${esc(t('tours.km'))} · ${esc(uren(x.h))}</small></span>
        <span class="b-vink">${icon('i-vink')}</span>
      </label>`;
    }).join('')}

function kalender() {
  const x = tourById(B.tour);
  const [y, m] = B.view;
  const eerste = new Date(y, m, 1);
  const dagen = new Date(y, m + 1, 0).getDate();
  const offset = (eerste.getDay() + 6) % 7;
  const maandNaam = new Intl.DateTimeFormat(locale(), { month: 'long', year: 'numeric' }).format(eerste);
  const wd = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
  const weekdagen = Array.from({ length: 7 }, (_, i) => wd.format(new Date(2024, 0, 1 + i)).replace('.', ''));
  const lang_ = new Intl.DateTimeFormat(locale(), { weekday: 'long', day: 'numeric', month: 'long' });
  const vorigeKan = y > MIN.getFullYear() || (y === MIN.getFullYear() && m > MIN.getMonth());
  const volgendeKan = y < MAX.getFullYear() || (y === MAX.getFullYear() && m < MAX.getMonth());
  let cellen = '';
  for (let i = 0; i < offset; i++) cellen += '<span></span>';
  for (let d = 1; d <= dagen; d++) {
    const dt = new Date(y, m, d);
    const iso = isoVan(dt);
    const ok = magDatum(dt, x);
    const cls = ['kal-dag', isoVan(vandaag) === iso ? 'is-vandaag' : '', B.date === iso ? 'is-gekozen' : ''].filter(Boolean).join(' ');
    cellen += `<button class="${cls}" type="button" data-dag="${iso}" aria-label="${esc(lang_.format(dt))}" aria-pressed="${B.date === iso}"${ok ? '' : ' disabled'}>${d}</button>`;
  }
  return `<div class="kal">
    <div class="kal-kop">
      <button class="rondknop" type="button" data-maand="-1" aria-label="${esc(t('book.prevMonth'))}"${vorigeKan ? '' : ' disabled'}>${icon('i-links')}</button>
      <p class="kal-maand" aria-live="polite">${esc(maandNaam)}</p>
      <button class="rondknop" type="button" data-maand="1" aria-label="${esc(t('book.nextMonth'))}"${volgendeKan ? '' : ' disabled'}>${icon('i-rechts')}</button>
    </div>
    <div class="kal-weekdagen" aria-hidden="true">${weekdagen.map((w) => `<span>${esc(w)}</span>`).join('')}</div>
    <div class="kal-grid">${cellen}</div>
  </div>`;
}

function stap2() {
  const x = tourById(B.tour);
  const delen = x.fixed
    ? `<p class="vast-tijd">${icon('i-klok')}${esc(t('book.fixed'))}</p>`
    : `<div class="chips" role="radiogroup" aria-labelledby="b-deel">${x.parts.map((p) => `<button class="chip" type="button" role="radio" data-part="${p}" aria-checked="${B.part === p}">${icon(PART_ICON[p])}${esc(t(`book.${p}`))}</button>`).join('')}</div>`;
  return `<h2 class="b-vraag">${esc(t('book.q2'))}</h2>
  <p class="b-gekozen">${icon('i-fiets')}<span>${esc(t(`tours.items.${B.tour}.name`))}</span></p>

function bedragBlok() {
  const b = bedragen();
  const naam = t(`tours.items.${B.tour}.name`);
  const rijen = [`<div><span>${B.n} × ${esc(naam)}</span><span>${esc(euro(b.basis))}</span></div>`];
  if (b.korting) rijen.push(`<div class="korting"><span>${esc(t('book.discount'))}</span><span>− ${esc(euro(b.korting))}</span></div>`);
  if (b.eten) rijen.push(`<div><span>${B.n} × ${esc(t(B.meal === 'lunch' ? 'book.mealLunch' : 'book.mealDinner').split('·')[0].trim())}</span><span>${esc(euro(b.eten))}</span></div>`);
  rijen.push(`<div class="totaal"><span>${esc(t('book.total'))}</span><span>${esc(euro(b.totaal))}</span></div>`);

}

function stap3() {
  const x = tourById(B.tour);
  return `<h2 class="b-vraag">${esc(t('book.q3'))}</h2>
  <div class="teller">
    <button class="rondknop" type="button" data-n="-1" aria-label="−1"${B.n <= 1 ? ' disabled' : ''}>${icon('i-min')}</button>
    <output aria-live="polite">${B.n}</output>
    <button class="rondknop" type="button" data-n="1" aria-label="+1"${B.n >= MAX_N ? ' disabled' : ''}>${icon('i-plus')}</button>
  </div>
  <p class="teller-label">${esc(B.n === 1 ? t('book.person') : t('book.personsWord'))}</p>

  <div class="chips" role="radiogroup" aria-labelledby="b-eten">${['none', 'lunch', 'dinner'].map((k) => `<button class="chip" type="button" role="radio" data-meal="${k}" aria-checked="${B.meal === k}">${k === 'none' ? '' : icon('i-bord')}${esc(t(k === 'none' ? 'book.mealNone' : k === 'lunch' ? 'book.mealLunch' : 'book.mealDinner'))}</button>`).join('')}</div>` : ''}
  <div class="b-bedrag">${bedragBlok()}</div>
  <p class="b-noot">${esc(B.n < GROEP_VANAF ? t('tours.groupNote') : t('book.payNote'))}</p>

function stap4() {
  const x = tourById(B.tour);
  const b = bedragen();
  const regels = [
    ['i-fiets', t(`tours.items.${B.tour}.name`)],
    ['i-kal', `${langeDatum(B.date)} · ${partNaam()}`],
    ['i-groep', `${personen(B.n)}${x.meal && B.meal !== 'none' ? ` · ${mealNaam()}` : ''}`],

  <div class="veld"><label for="b-opm">${esc(t('book.note'))} <small>(${esc(t('book.optional'))})</small></label><textarea id="b-opm" rows="3" placeholder="${esc(t('book.notePh'))}">${esc(B.note)}</textarea></div>
  <div class="overzicht">
    <h3>${esc(t('book.summary'))}</h3>
    <ul>${regels.map(([i, s]) => `<li>${icon(i)}<span>${esc(s)}</span></li>`).join('')}</ul>
  </div>
  <p class="b-noot">${esc(t('book.payNote'))}</p>
  <div class="b-verstuur">
    <a class="knop knop-wa" id="b-wa" href="${waLink(bericht())}" target="_blank" rel="noopener">${icon('i-wa')}<span>${esc(t('book.send'))}</span></a>
    <p class="b-fout" role="alert"></p>

const mailLink = () => `mailto:${MAIL}?subject=${encodeURIComponent(t('book.mailSubject', msgLang()))}&body=${encodeURIComponent(bericht())}`;

function klaar() {
  return `<div class="klaar">
    <div class="klaar-icoon">${icon('i-vink')}</div>
    <h2 class="b-vraag">${esc(t('book.doneT'))}</h2>
    <p>${esc(t('book.doneD'))}</p>
    <div class="knoppen"><button class="knop knop-lijn" type="button" data-b="opnieuw">${icon('i-kal')}<span>${esc(t('book.again'))}</span></button></div>
  </div>`;
}

function tekenPaneel(animeer = true, focus = null) {
  if (!B.tour && B.step > 1) B.step = 1;
  let html;
  if (B.done) html = klaar();
  else html = voortgang() + `<div class="b-stap">${[stap1, stap2, stap3, stap4][B.step - 1]()}</div>`;
  paneel.innerHTML = html;
  const sleutel = B.done ? 5 : B.step;
  if (animeer && sleutel !== laatsteStap) { const s = $('.b-stap, .klaar', paneel); s && s.classList.add('stap-in'); }
  laatsteStap = sleutel;
  if (focus) { const el = $(focus, paneel); el && el.focus({ preventScroll: true }); }
}

function fout(tekst) { const el = $('.b-fout', paneel); if (el) el.textContent = tekst; }

// Alleen na een tik in de agenda: haal het begin van de nieuwe stap in beeld als dat er niet al is.
function naarPaneel() {
  const top = paneel.getBoundingClientRect().top;
  if (top < kopbalk.offsetHeight || top > innerHeight * 0.45) paneel.scrollIntoView({ behavior: rustig ? 'auto' : 'smooth', block: 'start' });
}

paneel.addEventListener('change', (e) => {
  if (e.target.name === 'b-tour') {
    kiesTour(e.target.value);
    $$('.b-tour', paneel).forEach((l) => l.classList.toggle('is-gekozen', $('input', l).checked));
    $('[data-b="verder"]', paneel)?.removeAttribute('aria-disabled');
  }
});

paneel.addEventListener('input', (e) => {
  if (e.target.id === 'b-naam') { B.name = e.target.value; fout(''); }
  else if (e.target.id === 'b-opm') B.note = e.target.value;
  else return;
  const wa = $('#b-wa', paneel); if (wa) wa.href = waLink(bericht());
  const ml = $('#b-mail', paneel); if (ml) ml.href = mailLink();
});

paneel.addEventListener('click', (e) => {
  const el = e.target.closest('button, a');
  if (!el || !paneel.contains(el)) return;
  if (el.dataset.dag) { B.date = el.dataset.dag; fout(''); tekenPaneel(true, `[data-dag="${B.date}"]`); return; }
  if (el.dataset.maand) {
    const d = new Date(B.view[0], B.view[1] + Number(el.dataset.maand), 1);
    B.view = [d.getFullYear(), d.getMonth()];
    tekenPaneel(true, `[data-maand="${el.dataset.maand}"]:not(:disabled)`);
    return;
  }
  if (el.dataset.part) { B.part = el.dataset.part; tekenPaneel(true, `[data-part="${B.part}"]`); return; }
  if (el.dataset.n) {
    B.n = Math.min(MAX_N, Math.max(1, B.n + Number(el.dataset.n)));
    tekenPaneel(true, `[data-n="${el.dataset.n}"]:not(:disabled)`);
    if (!document.activeElement || !paneel.contains(document.activeElement)) $('[data-n]:not(:disabled)', paneel)?.focus({ preventScroll: true });
    return;
  }
  if (el.dataset.meal) { B.meal = el.dataset.meal; tekenPaneel(true, `[data-meal="${B.meal}"]`); return; }
  const b = el.dataset.b;
  if (b === 'verder') {
    if (B.step === 1 && !B.tour) return;
    if (B.step === 2 && !B.date) { fout(t('book.pickDate')); return; }
    B.step = Math.min(4, B.step + 1);
    tekenPaneel(true, B.step === 4 && !B.name ? null : '.b-vraag');
    naarPaneel();
    return;
  }
  if (b === 'terug') { B.step = Math.max(1, B.step - 1); tekenPaneel(true); naarPaneel(); return; }
  if (b === 'opnieuw') { B = nieuwB(); tekenPaneel(true); naarPaneel(); return; }
  if (el.id === 'b-wa') {
    if (!B.name.trim()) { e.preventDefault(); fout(t('book.needName')); $('#b-naam', paneel)?.focus(); return; }
    el.href = waLink(bericht());
    setTimeout(() => { B.done = true; tekenPaneel(true); }, 60);
  }
});

paneel.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'b-naam') { e.preventDefault(); $('#b-wa', paneel)?.click(); }
});

// ---------- Overal klikken ----------
const menu = $('#menu');
const taalLijst = $('.taallijst');
const taalKnop = $('.taalknop');

function zetMenu(open) {
  menu.hidden = !open;
  $$('.menuknop[aria-controls="menu"]').forEach((b) => b.setAttribute('aria-expanded', String(open)));
  document.body.classList.toggle('vast-scherm', open);
  if (open) $('.menu-dicht').focus();
}
function zetTaalLijst(open) {
  taalLijst.hidden = !open;
  taalKnop.setAttribute('aria-expanded', String(open));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, a');
  if (!taalLijst.hidden && !e.target.closest('.taal')) zetTaalLijst(false);
  if (!el) return;
  if (el === taalKnop) { zetTaalLijst(taalLijst.hidden); return; }
  if (el.dataset.lang) { zetTaal(el.dataset.lang); zetTaalLijst(false); return; }
  if (el.matches('.menuknop[aria-controls="menu"]')) { zetMenu(true); return; }
  if (el.matches('.menu-dicht')) { zetMenu(false); return; }
  if (el.dataset.filter) { zetFilter(el.dataset.filter); return; }
  if (el.hasAttribute('data-duim')) { naarFoto(el); return; }
  if (el.hasAttribute('data-plan')) {
    e.preventDefault();
    const id = el.dataset.plan;
    if (id) { B = nieuwB(); kiesTour(id); B.step = 2; }
    else if (B.done) B = nieuwB();
    tekenPaneel(true);
    naar('plannen');
    return;
  }
  // Link naar de pagina waar je al bent: terug naar boven in plaats van niets.
  const href = el.getAttribute('href');
  if (href && href[0] === '#' && href.slice(1) === location.hash.slice(1)) { e.preventDefault(); toon(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!taalLijst.hidden) { zetTaalLijst(false); taalKnop.focus(); }
  if (!menu.hidden) zetMenu(false);
});

function ctaInBeeld() {
  const el = paginaEl();
  return !!el && $$('[data-cta]', el).some((c) => { const b = c.getBoundingClientRect(); return b.height > 0 && b.bottom > 0 && b.top < innerHeight; });
}

let tikt = false;
function opScroll() {
  tikt = false;
  const y = window.scrollY;
  kopbalk.classList.toggle('is-gescrold', y > 8);
  const cta = ctaInBeeld();
  balk.classList.toggle('is-weg', y < 120 || cta);
  zweef.classList.toggle('is-zichtbaar', y > innerHeight * 0.7 && !cta);
}
const plan = () => { if (!tikt) { tikt = true; requestAnimationFrame(opScroll); } };
addEventListener('scroll', plan, { passive: true });
addEventListener('resize', plan, { passive: true });

// ---------- Onthullen ----------
let onthul = null;
if (!rustig && 'IntersectionObserver' in window) {
  onthul = new IntersectionObserver((items) => {
    items.forEach((it) => { if (it.isIntersecting) { it.target.classList.add('is-zichtbaar'); onthul.unobserve(it.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
}
function kijk(el) { if (onthul) onthul.observe(el); else el.classList.add('is-zichtbaar'); }
function onthulIn(root, direct = false) {
  $$('.raster, .stappen', root).forEach((r) => $$(':scope > .onthul', r).forEach((el, i) => { if (!el.style.transitionDelay) el.style.transitionDelay = `${(i % 4) * 90}ms`; }));
  $$('.onthul:not(.is-zichtbaar)', root).forEach((el) => { if (direct) el.classList.add('is-zichtbaar'); else kijk(el); });
}

// ---------- Start ----------
// Een geopende link begint altijd bovenaan: de browser mag geen oude scrollstand terugzetten.
try { history.scrollRestoration = 'manual'; } catch { /* oudere browser */ }
vertaal();
onthulIn(document);
toon({ eerste: true });
let gebruikerActief = false;
['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach((ev) => addEventListener(ev, () => { gebruikerActief = true; }, { once: true, passive: true, capture: true }));
addEventListener('load', () => { if (!gebruikerActief && scrollY !== 0) scrollTo(0, 0); });
addEventListener('pageshow', (e) => { if (e.persisted) scrollTo(0, 0); });
})();

</script>
